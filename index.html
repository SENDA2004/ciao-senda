/* =========================================================
   1. PERSISTENCE — progress is saved on the device
   ========================================================= */
const STORE_KEY="ciao-senda-v1";
let STORAGE_OK=true;
function SAVE(){
  if(!STORAGE_OK) return;
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({
      done:S.done,goals:S.goals,checklist:S.checklist,days:S.days,
      review:S.review,streak:S.streak,last:S.last,speech:S.speech||{}
    }));
    flashSaved();
  }catch(e){ STORAGE_OK=false; }
}
function LOAD(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) { STORAGE_OK=true; return; }
    const d=JSON.parse(raw);
    S.done=d.done||{}; S.goals=d.goals||{}; S.checklist=d.checklist||{};
    S.days=d.days||{}; S.review=d.review||[]; S.streak=d.streak||1;
    S.last=d.last||null; S.speech=d.speech||{};
  }catch(e){ STORAGE_OK=false; }
}
function touchStreak(){
  const today=new Date().toISOString().slice(0,10);
  if(S.last===today) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.last===y) ? (S.streak||0)+1 : 1;
  S.last=today; SAVE();
}
let saveTimer=null;
function flashSaved(){
  const el=document.getElementById("savedchip"); if(!el) return;
  el.style.opacity="1"; clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ el.style.opacity="0"; },1400);
}
/* wrap the core mutators so every change is written to disk */
const _mark=mark;      mark=function(id,v){ _mark(id,v); SAVE(); };
const _addReview=addReview; addReview=function(q,a,w,s){ _addReview(q,a,w,s); SAVE(); };
const _render=render;  render=function(){ _render(); SAVE(); };

S.speech=S.speech||{};   // paragraph id -> best score

function exportData(){
  const blob=new Blob([JSON.stringify({done:S.done,goals:S.goals,checklist:S.checklist,days:S.days,
    review:S.review,streak:S.streak,last:S.last,speech:S.speech},null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ciao-senda-progress-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{
     const d=JSON.parse(r.result);
     S.done=d.done||{}; S.goals=d.goals||{}; S.checklist=d.checklist||{}; S.days=d.days||{};
     S.review=d.review||[]; S.streak=d.streak||1; S.last=d.last||null; S.speech=d.speech||{};
     SAVE(); render();
   }catch(e){ alert("File not valid."); } };
  r.readAsText(file);
}

/* =========================================================
   3. SPEECH RECOGNITION + SCORING
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const STOPW=new Set(["il","la","lo","i","gli","le","un","una","di","a","da","in","con","su","per","e","che","è","ho","mi","il"]);
function toks(s){
  return String(s).toLowerCase()
    .replace(/[«».,;:!?"'`()–—]/g," ")
    .replace(/\s+/g," ").trim().split(" ").filter(Boolean);
}
function lcs(a,b){
  const m=a.length,n=b.length;
  let prev=new Array(n+1).fill(0),cur=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++) cur[j]= a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j],cur[j-1]);
    prev=cur; cur=new Array(n+1).fill(0);
  }
  return prev[n];
}
function scoreSpeech(said,target,sec,conf){
  const sw=toks(said), tw=toks(target);
  if(!sw.length) return null;
  const pool=sw.slice();
  let matched=0, missed=[];
  tw.forEach(w=>{ const i=pool.indexOf(w); if(i>=0){ pool.splice(i,1); matched++; } else missed.push(w); });
  const order=tw.length?lcs(tw,sw)/tw.length:0;
  const completeness=Math.round(100*matched/Math.max(1,tw.length));
  const accuracy=Math.round(100*order);
  const wpm=sec>0?Math.round(sw.length/(sec/60)):0;
  let fluency=100;
  if(wpm<55) fluency-= (55-wpm)*1.4;
  if(wpm>165) fluency-= Math.min(40,(wpm-165)*0.8);
  const extra=Math.max(0,sw.length-tw.length);
  fluency-=Math.min(20,extra*1.5);
  fluency=Math.max(20,Math.min(100,Math.round(fluency)));
  const pron=Math.max(20,Math.min(100,Math.round((conf?conf*100:completeness)*0.6+completeness*0.4)));
  const overall=Math.round(accuracy*0.35+completeness*0.3+fluency*0.15+pron*0.2);
  return {accuracy,completeness,fluency,pron,overall,wpm,words:sw.length,
          missed:[...new Set(missed)].filter(w=>!STOPW.has(w)).slice(0,14),said:sw.join(" ")};
}
function scoreFree(said,sec){
  const sw=toks(said);
  if(!sw.length) return null;
  const uniq=new Set(sw).size;
  const wpm=sec>0?Math.round(sw.length/(sec/60)):0;
  const fillers=sw.filter(w=>["ehm","mmm","eh","ah","come","dire"].indexOf(w)>=0).length;
  let fluency=100;
  if(wpm<50) fluency-=(50-wpm)*1.5;
  if(wpm>170) fluency-=(wpm-170);
  fluency-=fillers*3;
  fluency=Math.max(20,Math.min(100,Math.round(fluency)));
  const range=Math.max(20,Math.min(100,Math.round(uniq/Math.max(1,sw.length)*180)));
  const length=Math.max(20,Math.min(100,Math.round(sw.length/ (sec/60*70) *100)));
  const overall=Math.round(fluency*0.4+range*0.3+length*0.3);
  return {fluency,range,length,overall,wpm,words:sw.length,uniq,fillers,said:sw.join(" ")};
}

/* --- recording engine shared by all speaking pages --- */
let REC=null, RECDATA=null;
function startRec(opts){
  if(!SR){ opts.onerror&&opts.onerror("nosr"); return; }
  try{ REC&&REC.stop(); }catch(e){}
  REC=new SR();
  REC.lang="it-IT"; REC.continuous=true; REC.interimResults=true; REC.maxAlternatives=1;
  RECDATA={final:"",interim:"",conf:[],t0:Date.now()};
  REC.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ RECDATA.final+=" "+r[0].transcript; if(r[0].confidence) RECDATA.conf.push(r[0].confidence); }
      else interim+=r[0].transcript;
    }
    RECDATA.interim=interim;
    opts.onpartial&&opts.onpartial((RECDATA.final+" "+interim).trim());
  };
  REC.onerror=e=>{ opts.onerror&&opts.onerror(e.error); };
  REC.onend=()=>{
    const sec=(Date.now()-RECDATA.t0)/1000;
    const conf=RECDATA.conf.length?RECDATA.conf.reduce((a,b)=>a+b,0)/RECDATA.conf.length:0;
    opts.ondone&&opts.ondone(RECDATA.final.trim(),sec,conf);
  };
  try{ REC.start(); }catch(e){ opts.onerror&&opts.onerror("start"); }
}
function stopRec(){ try{ REC&&REC.stop(); }catch(e){} }
function scoreBars(r,mode){
  const rows = mode==="free"
    ? [["Fluency",r.fluency],["Vocabulary range",r.range],["Length / stamina",r.length]]
    : [["Accuracy (right words, right order)",r.accuracy],["Completeness (nothing skipped)",r.completeness],
       ["Fluency (speed, no long gaps)",r.fluency],["Pronunciation (how clearly it was heard)",r.pron]];
  return `<div class="spread" style="margin-bottom:10px"><h3>Punteggio: ${r.overall}%</h3>
    <span class="pill ${r.overall>=75?"p-olive":r.overall>=55?"p-gold":"p-red"}">${r.overall>=75?"Ottimo":r.overall>=55?"Buono":"Ancora un po'"}</span></div>
    ${rows.map(x=>statRow(x[0],x[1])).join("")}
    <p style="font-size:12.5px;color:var(--muted)">${r.words} words · ${r.wpm} words/minute${r.fillers!==undefined?" · "+r.fillers+" hesitations":""}</p>`;
}
function micUI(id){
  return `<div class="card" id="${id}">
    <div class="row"><button class="btn primary" data-rec="start">🎤 Start speaking</button>
      <button class="btn" data-rec="stop" disabled>■ Stop &amp; get my score</button>
      <span class="rectime" style="font-family:var(--serif);font-size:18px"></span></div>
    <div class="box voc live" style="display:none;min-height:52px"><b>Sento:</b> <span class="txt"></span></div>
    <div class="res"></div></div>`;
}
function bindMic(box,target,mode,key){
  const bs=$("[data-rec='start']",box), bt=$("[data-rec='stop']",box),
        live=$(".live",box), livetxt=$(".txt",live), res=$(".res",box), time=$(".rectime",box);
  let t0=null,tick=null;
  if(!SR){
    bs.disabled=true; bt.disabled=true;
    res.innerHTML=`<div class="box imp"><h4>Speech scoring needs Chrome</h4>
      Your browser cannot listen. Open this page in <b>Google Chrome</b> (computer or Android) and it will work.
      On iPhone, Safari does not support it — use Chrome on a computer for the speaking coach.
      Everything else in the app works normally here.</div>`;
    return;
  }
  bs.onclick=()=>{
    res.innerHTML=""; live.style.display=""; livetxt.textContent="…";
    bs.disabled=true; bt.disabled=false; t0=Date.now();
    tick=setInterval(()=>{ time.textContent=Math.round((Date.now()-t0)/1000)+"s"; },250);
    startRec({
      onpartial:t=>{ livetxt.textContent=t; },
      onerror:e=>{
        clearInterval(tick); bs.disabled=false; bt.disabled=true;
        res.innerHTML=`<div class="box imp"><h4>Microphone problem</h4>${
          e==="not-allowed"?"You must allow the microphone. Click the padlock in the address bar → Microphone → Allow.":
          e==="no-speech"?"I heard nothing. Speak closer to the microphone and try again.":
          "Error: "+esc(e)+". Try again, or reload the page."}</div>`;
      },
      ondone:(txt,sec,conf)=>{
        clearInterval(tick); bs.disabled=false; bt.disabled=true; live.style.display="none";
        if(!txt){ res.innerHTML=`<div class="box imp">I didn't hear anything. Try again and speak clearly.</div>`; return; }
        if(sec<2.5){ res.innerHTML=`<div class="box imp"><h4>Too short to score</h4>You spoke for less than three seconds. Press start, wait one second, then speak a full sentence.</div>`; return; }
        const r = mode==="free" ? scoreFree(txt,sec) : scoreSpeech(txt,target,sec,conf);
        if(!r){ res.innerHTML=`<div class="box imp">Nothing to score.</div>`; return; }
        if(key){ const best=S.speech[key]||0; if(r.overall>best){ S.speech[key]=r.overall; } SAVE(); }
        res.innerHTML=scoreBars(r,mode)+
          `<div class="box voc"><h4>What the computer heard</h4><span class="it">${esc(r.said)}</span></div>`+
          (mode!=="free"&&r.missed.length?`<div class="box mem"><h4>Words you skipped or that were not understood</h4>
            <div class="chips">${r.missed.map(w=>`<span class="chip" data-say="${esc(w)}">${esc(w)}</span>`).join("")}</div>
            <button class="btn sm addrev" style="margin-top:8px">Add these to my review list</button></div>`:"")+
          `<div class="box ${r.overall>=75?"say":"imp"}"><h4>What to do now</h4>${
            r.overall>=85?"Excellent — say it once more tomorrow and move on.":
            r.overall>=70?"Good. Repeat the sentences with the skipped words, then record again.":
            r.overall>=50?"Listen to the model audio twice, repeat sentence by sentence, then record again.":
            "Slow down. Do the shadowing exercise sentence by sentence before recording the whole paragraph."}</div>
          <p style="font-size:12px;color:var(--muted)">The score comes from the browser's Italian speech recognition. It shows how clearly you were understood — it is a practice tool, not an exam.</p>`;
        $$("[data-say]",res).forEach(b=>b.onclick=()=>say(b.dataset.say,0.8));
        const ar=$(".addrev",res);
        if(ar) ar.onclick=()=>{ r.missed.forEach(w=>addReview("Pronounce / remember this word",w,"Skipped while speaking","speaking")); ar.textContent="✓ Added"; ar.disabled=true; };
      }
    });
  };
  bt.onclick=()=>{ stopRec(); };
}

    <div class="card"><h4>Your own words</h4>

  </div></div>`;

function shadow(p){
  let i=0;
  const next=()=>{
    if(i>=p.s.length) return;
    const u=new SpeechSynthesisUtterance(p.s[i][0]);
    u.lang="it-IT"; u.rate=0.8; if(VOICE) u.voice=VOICE;
    u.onend=()=>{ const pause=Math.max(2200,p.s[i][0].length*55); i++; setTimeout(next,pause); };
    speechSynthesis.speak(u);
  };
  speechSynthesis.cancel(); next();
}

/* ---------- XP & LEVELS ---------- */
const XPW={"les-":40,"g-":25,"verb-":15,"r-":35,"dish-":20,"iq-":8,"para-":50,"li-":15,"test-":60,"v-":10};
function xp(){
  let t=0;
  Object.keys(S.done).forEach(k=>{ if(!S.done[k]) return;
    for(const p in XPW){ if(k.indexOf(p)===0){ t+=XPW[p]; return; } }
    t+=10;
  });
  Object.keys(S.days).forEach(k=>{ if(S.days[k]) t+=30; });
  Object.values(S.speech||{}).forEach(v=>t+=Math.round(v/2));
  Object.keys(S.ach).forEach(id=>{ const a=ACH.find(x=>x.id===id); if(a) t+=a.xp; });
  return t;
}
const LEVELS=[
 [0,"Principiante","You are starting. Every sentence counts."],
 [700,"Apprendista","You can already introduce yourself and greet guests."],
 [1800,"In sala","You know the service sequence and the basic vocabulary."],
 [3200,"Cameriera","You can handle a table from welcome to bill."],
 [5000,"Professionista","You handle problems, the chef and the menu."],
 [7000,"Pronta per il colloquio","You are ready. Go and get the job."]
];
function levelOf(x){
  let i=0; LEVELS.forEach((l,k)=>{ if(x>=l[0]) i=k; });
  const next=LEVELS[i+1];
  return {i:i,name:LEVELS[i][1],note:LEVELS[i][2],cur:x,base:LEVELS[i][0],
    next:next?next[0]:null,nextName:next?next[1]:null,
    pct:next?Math.round((x-LEVELS[i][0])/(next[0]-LEVELS[i][0])*100):100};
}

function readiness(){
  const P=[
   {k:"Presentarmi",w:18,cur:iqDone("personal")+ (done("para-p-presentazione")?4:0) + (done("para-p-esperienza")?4:0),max:18,
    go:"paragraphs/p-presentazione",miss:"Learn questions 1–10 and record your introduction."},
   {k:"Esperienza e motivazione",w:18,cur:iqDone("experience")+iqDone("why")+(done("para-p-perche")?4:0),max:28,
    go:"iv-g/experience",miss:"Learn questions 11–34 and the «Perché Equilibrio» paragraph."},
   {k:"Menu e servizio",w:20,cur:iqDone("menu")+countDone("dish-")+countDone("r-"),max:37,
    go:"eq-dishes",miss:"Learn the dishes, the restaurant modules and questions 54–67."},
   {k:"Capire lo chef",w:15,cur:countDone("li-")+(done("chef-done")?4:0)+iqDone("team"),max:27,
    go:"li-chef",miss:"Do the listening labs, the chef simulator and questions 35–45."},
   {k:"Parlare ad alta voce",w:20,cur:speechAbove(65)*2+(done("sim-done")?4:0)+PARAS.filter(p=>done("para-"+p.id)).length,max:22,
    go:"paragraphs",miss:"Record the six paragraphs and score 65%+ on at least four."},
   {k:"Problemi e emergenze",w:9,cur:iqDone("difficult")+(done("shift")?3:0)+(done("qwords")?3:0),max:14,
    go:"iv-g/difficult",miss:"Learn questions 46–53, the question words and the full shift."}
  ];
  P.forEach(p=>{ p.pct=Math.min(100,Math.round(p.cur/p.max*100)); });
  const total=Math.round(P.reduce((s,p)=>s+p.pct*p.w,0)/P.reduce((s,p)=>s+p.w,0));
  return {P:P,total:total};
}
function ring(pct,size,label){
  const r=(size/2)-9, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="48%" text-anchor="middle" font-family="Lora,serif" font-size="${size/4.2}" font-weight="700" fill="var(--ink)">${pct}%</text>
    <text x="50%" y="64%" text-anchor="middle" font-family="Inter,sans-serif" font-size="${size/13}" fill="var(--muted)" letter-spacing="1.5">${esc(label||"")}</text>
  </svg>`;
}

}

/* ---------- which skill does an exercise belong to ---------- */
function skillOf(key){
  key=String(key||"");
  if(key.indexOf("li-")===0) return "listening";
  if(key.indexOf("g-")===0||key.indexOf("qw")===0||key.indexOf("verbdrill")===0||key.indexOf("q-verb")===0||key.indexOf("q-grammar")===0) return "grammar";
  if(key.indexOf("q-vocab")===0||key.indexOf("ex-a1")===0||key.indexOf("ex-a2")===0) return "vocabulary";
  if(key.indexOf("rq-")===0||key.indexOf("sc-")===0||key==="shift"||key.indexOf("wine")===0||key.indexOf("q-rest")===0) return "service";
  if(key.indexOf("eqmenu")===0||key.indexOf("dishq")===0||key.indexOf("eqres")===0) return "menu";
  if(key.indexOf("intro")===0||key.indexOf("para-")===0) return "interview";
  if(key.indexOf("q-trans")===0||key.indexOf("q-mixed")===0) return "translation";
  if(key.indexOf("test-")===0) return "exam";
  return "other";
}

/* ---------- statistics ---------- */
function stats(days){
  const since=days?Date.now()-days*864e5:0;
  const out={};
  S.log.filter(l=>l.t>=since).forEach(l=>{
    out[l.s]=out[l.s]||{n:0,ok:0};
    out[l.s].n++; out[l.s].ok+=l.ok;
  });
  Object.keys(out).forEach(k=>out[k].pct=Math.round(out[k].ok/out[k].n*100));
  return out;
}
function bestSpeech(){ const v=Object.values(S.speech||{}); return v.length?Math.max(...v):0; }
const BANDS=[[0,"A1.1","Very beginner. You recognise words, not yet sentences."],
 [35,"A1.2","Beginner. Short fixed sentences, very slow speech."],
 [50,"A2.1","Elementary. You handle simple predictable exchanges."],
 [65,"A2.2","Strong elementary. You cope with a real service, with effort."],
 [80,"B1.1","Threshold. You handle unexpected questions and explain yourself."],
 [92,"B1.2","Confident threshold. You work in Italian without translating first."]];
function bandOf(p){ let b=BANDS[0]; BANDS.forEach(x=>{ if(p>=x[0]) b=x; }); return {code:b[1],desc:b[2]}; }

/* combines accuracy with how much you have actually done — like a real exam, breadth counts */
function levelEstimate(){
  const st=stats();
  const acc=k=>st[k]?st[k].pct:null;
  const cov=(c,total)=>Math.min(100,Math.round(c/total*100));
  const parts=[
   {k:"listening",acc:acc("listening"),cov:cov(countDone("li-"),LISTEN.length),w:20},
   {k:"grammar",acc:acc("grammar"),cov:cov(countDone("g-")+countDone("verb-")/2,GRAMMAR.length+VERBS.length/2),w:20},
   {k:"vocabulary",acc:acc("vocabulary"),cov:cov(countDone("v-"),A1.length+A2.length),w:15},
   {k:"service",acc:acc("service"),cov:cov(countDone("r-"),REST.length),w:15},
   {k:"interview",acc:acc("interview"),cov:cov(IQ.filter(q=>done("iq-"+q.n)).length,IQ.length),w:15},
   {k:"speaking",acc:bestSpeech()||null,cov:cov(PARAS.filter(p=>(S.speech||{})[p.id]).length,PARAS.length),w:15}
  ];
  parts.forEach(p=>{
    p.score = p.acc===null ? Math.round(p.cov*0.35) : Math.round(p.acc*0.65+p.cov*0.35);
    p.band=bandOf(p.score).code;
  });
  const total=Math.round(parts.reduce((s,p)=>s+p.score*p.w,0)/parts.reduce((s,p)=>s+p.w,0));
  return {parts:parts,total:total,band:bandOf(total)};
}

/* ---------- THE LEVEL EXAM ---------- */
function buildExam(){
  const pick=(a,n)=>shuffle(a).slice(0,n);
  const items=[];
  pick(LISTEN,5).forEach(l=>items.push({s:"listening",k:"mc",audio:l.txt,rate:l.rate,q:l.q,o:l.o,a:l.a,w:"Transcript: <b>"+esc(l.txt)+"</b>"}));
  pick(GRAMMAR.flatMap(g=>g.ex),7).forEach(x=>items.push(Object.assign({s:"grammar"},x)));
  pick(VOCAB_POOL,5).forEach(p=>{
    const wrong=shuffle(VOCAB_POOL.filter(x=>x[1]!==p[1])).slice(0,2).map(x=>x[1]);
    const opts=shuffle([p[1]].concat(wrong));
    items.push({s:"vocabulary",k:"mc",q:`<span class="it">${esc(p[0])}</span> = ?`,o:opts,a:opts.indexOf(p[1]),w:`<b>${esc(p[0])}</b> = ${esc(p[1])}`});
  });
  pick(REST.flatMap(r=>r.quiz),5).forEach(q=>items.push({s:"service",k:"mc",q:q.q,o:q.o,a:q.a,w:q.w}));
  pick(TESTS.int.items.concat(TESTS.rest.items),4).forEach(x=>items.push(Object.assign({s:"interview"},x)));
  pick(TRANSLATE_POOL,4).forEach(t=>items.push({s:"translation",k:"tr",q:esc(t.en),a:t.it,w:"Model: <b>"+esc(t.it[0])+"</b>"}));
  return items;
}

  box.innerHTML=`

       :`<input class="inp" id="exinp" style="width:100%;max-width:420px" placeholder="Scrivi in italiano…">
         <div class="row" style="margin-top:10px"><button class="btn primary" id="exnext">Next →</button>

     ${it.k==="mc"?`<div class="row" style="margin-top:10px"><button class="btn ghost" id="exskip">Skip</button></div>`:""}

  $$("[data-say]",box).forEach(b=>b.onclick=()=>say(b.dataset.say,+b.dataset.rate));

function examReport(){

  const by={};
  E.ans.forEach(a=>{ by[a.s]=by[a.s]||{n:0,ok:0}; by[a.s].n++; by[a.s].ok+=a.ok?1:0; });

     </div></div></div>
   <div class="card"><h3>Per abilità</h3>
     ${Object.keys(by).map(k=>`<div style="margin-bottom:13px">
       <div style="display:flex;justify-content:space-between;font-size:13px">
         <span><b>${esc(SKILL_LABEL[k]||k)}</b> ${k!=="speaking"?`<span style="color:var(--muted)">· ${by[k].ok}/${by[k].n}</span>`:""}</span>
         <b>${by[k].pct}% · ${bandOf(by[k].pct).code}</b></div>
       <div class="bar"><i style="width:${by[k].pct}%"></i></div></div>`).join("")}</div>
   <div class="card"><h3>Punto forte e punto debole</h3>
     <div class="box say"><b>Punto forte:</b> ${esc(SKILL_LABEL[strong]||strong)} — ${by[strong].pct}%. Keep it warm, don't over-study it.</div>
     <div class="box imp"><b>Punto debole:</b> ${esc(SKILL_LABEL[weak]||weak)} — ${by[weak].pct}%. This is what to work on this week.</div>
     <div class="row">
       <button class="btn primary" data-go="${weak==="listening"?"li-chef":weak==="grammar"?"grammar":weak==="vocabulary"?"vocab":weak==="service"?"rest":weak==="speaking"?"paragraphs":weak==="interview"?"iv-groups":"q-trans"}">▶ Work on ${esc(SKILL_LABEL[weak]||weak)}</button>
       <button class="btn" data-go="review">Review the ${wrong.length} wrong answers</button>
     </div></div>
   <div class="card"><h3>Le risposte sbagliate</h3>
     ${wrong.length?wrong.map(a=>`<div class="ph"><div style="flex:1">
       <div style="font-size:13.5px">${a.q}</div>
       <div style="font-size:12.5px"><span style="color:var(--red)">Tu: ${esc(a.given||"—")}</span> · <span class="it">Giusto: ${esc(a.right)}</span></div>
       <div class="en" style="font-size:12px">${a.w||""}</div></div></div>`).join("")
     :`<p class="it">Nessun errore. Bravissima.</p>`}</div>
   <div class="card"><h3>E per il colloquio?</h3>
     <p>Language level and interview readiness are two different things. Your readiness is <b>${r.total}%</b>.</p>
     <button class="btn" data-go="ready">Open the readiness page</button></div>
   <div class="row"><button class="btn ghost" data-go="leveltest">Back to the level page</button></div>`;
  $$("[data-go]",box).forEach(b=>b.onclick=()=>go(b.dataset.go));
}

/* ---------- STATISTICS PAGE ---------- */
ROUTES.stats=()=>{
  crumbs(["Progress","Statistics"]);
  const all=stats(), week=stats(7);
  const est=levelEstimate();
  const missed={};
  S.log.filter(l=>!l.ok).forEach(l=>{ missed[l.q]=(missed[l.q]||0)+1; });
  const worst=Object.entries(missed).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const days={};
  S.log.forEach(l=>{ const d=new Date(l.t).toISOString().slice(0,10); days[d]=(days[d]||0)+1; });
  const last14=Object.keys(days).sort().slice(-14);
  const max=Math.max(1,...last14.map(d=>days[d]));
  return head("Progress","Statistiche",
   `Every answer you give anywhere in the app is recorded here — ${S.log.length} so far. This is how the app knows your level.`)+
  `<div class="card"><div class="spread">
     <div><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700">Livello stimato</div>
       <h2 style="font-size:32px;margin:3px 0">${est.band.code}</h2>
       <p style="color:var(--muted);margin:0;max-width:44ch">${esc(est.band.desc)}</p>
       <button class="btn sm" data-go="leveltest" style="margin-top:10px">Sit the level exam</button></div>
     <div>${ring(est.total,124,"LIVELLO")}</div></div></div>
   <div class="card"><h3>Accuracy by skill</h3>
     ${Object.keys(SKILL_LABEL).filter(k=>all[k]).map(k=>`<div style="margin-bottom:12px">
       <div style="display:flex;justify-content:space-between;font-size:13px">
         <span><b>${esc(SKILL_LABEL[k])}</b> <span style="color:var(--muted)">· ${all[k].ok}/${all[k].n} correct${week[k]?" · "+week[k].pct+"% this week":""}</span></span>
         <b>${all[k].pct}%</b></div>
       <div class="bar"><i style="width:${all[k].pct}%"></i></div></div>`).join("")||`<p style="color:var(--muted)">Do a few exercises and this fills up.</p>`}</div>
   <div class="card"><h3>Activity — last 14 days</h3>
     <div style="display:flex;gap:5px;align-items:flex-end;height:90px">
       ${last14.length?last14.map(d=>`<div style="flex:1;text-align:center">
         <div title="${d}: ${days[d]} answers" style="background:linear-gradient(180deg,var(--gold),var(--olive));border-radius:4px;height:${Math.round(days[d]/max*70)}px"></div>
         <div style="font-size:9px;color:var(--muted);margin-top:4px">${d.slice(8)}</div></div>`).join("")
       :`<p style="color:var(--muted)">No activity recorded yet.</p>`}</div></div>
   <div class="card"><h3>Questions you get wrong most often</h3>
     ${worst.length?worst.map(w=>`<div class="ph"><span style="font-size:13.5px">${esc(w[0])}</span><span class="pill p-red">${w[1]}×</span></div>`).join("")
     :`<p style="color:var(--muted)">Nothing repeated yet.</p>`}
     <button class="btn sm" data-go="review" style="margin-top:10px">Open review list</button></div>`;
};

/* ---------- nav + achievements ---------- */
(function(){
  const prog=NAV.find(s=>s.g==="Progress");
  if(prog) prog.items=[["ready","Am I ready?"],["leveltest","Level exam"],["stats","Statistics"],["achievements","Achievements"]]
    .concat(prog.items.filter(i=>["ready","achievements"].indexOf(i[0])<0));
  ACH.push(
   {id:"a-exam1",i:"📊",t:"Primo esame",d:"Sit the level exam once.",xp:80,test:()=>done("exam-taken")},
   {id:"a-exam-a2",i:"📈",t:"Livello A2",d:"Reach A2.1 or higher in a level exam.",xp:150,
    test:()=>S.exams.some(e=>["A2.1","A2.2","B1.1","B1.2"].indexOf(e.band)>=0)},
   {id:"a-log200",i:"✍️",t:"200 risposte",d:"Answer 200 exercises in the app.",xp:100,test:()=>S.log.length>=200}
  );
})();
</script>
