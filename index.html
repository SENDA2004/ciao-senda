<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciao Senda — Italiano A1 → A2</title>
<style>
:root{
  --bg:#FAF6EF; --panel:#FFFFFF; --ink:#23221F; --muted:#7B7469; --line:#E8DFCE;
  --gold:#B08D4F; --gold-soft:#F3EADA; --olive:#6B7A4F; --olive-soft:#EDF0E4;
  --red:#B0463A; --red-soft:#FBEDEB; --blue:#3F6493; --blue-soft:#EAF0F7;
  --shadow:0 1px 2px rgba(35,34,31,.04),0 8px 24px rgba(35,34,31,.06);
  --radius:14px; --sidebar:268px;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#191817; --panel:#232220; --ink:#F0EBE1; --muted:#9C9488; --line:#34322E;
  --gold:#C9A768; --gold-soft:#2E2820; --olive:#9DB07A; --olive-soft:#242A20;
  --red:#D97567; --red-soft:#2E211F; --blue:#7FA5D0; --blue-soft:#1E252E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
h3{font-size:17px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--gold-soft)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);border-right:1px solid var(--line);
  position:fixed;inset:0 auto 0 0;overflow-y:auto;padding:20px 14px 90px;z-index:60;transition:transform .25s ease}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand .flag{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--olive),var(--gold));
  display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:16px;flex:0 0 34px}
.brand b{font-family:var(--serif);font-size:16px;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.navgroup{margin-bottom:2px}
.navgroup>.ghead{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;cursor:pointer;
  padding:9px 10px;border-radius:9px;color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700}
.navgroup>.ghead:hover{background:var(--gold-soft);color:var(--ink)}
.navgroup .chev{margin-left:auto;transition:transform .2s;opacity:.6;font-size:10px}
.navgroup.open .chev{transform:rotate(90deg)}
.navlist{display:none;padding:2px 0 8px 8px;border-left:1px solid var(--line);margin-left:18px}
.navgroup.open .navlist{display:block}
.navlink{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.navlink:hover{background:var(--gold-soft);color:var(--ink)}
.navlink.active{background:var(--gold-soft);color:var(--ink);font-weight:600}
.navlink .dot{width:6px;height:6px;border-radius:50%;background:var(--olive);opacity:0;flex:0 0 6px}
.navlink.done .dot{opacity:1}
.navsingle{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600}
.navsingle:hover{background:var(--gold-soft)}
.navsingle.active{background:var(--gold-soft)}

.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--ink);font-weight:600;font-family:var(--sans)}
.searchwrap{margin-left:auto;position:relative}
.search{width:210px;padding:8px 12px 8px 32px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.search:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
.searchwrap .ico{position:absolute;left:11px;top:8px;opacity:.45;font-size:13px}
.results{position:absolute;top:42px;right:0;width:340px;max-height:60vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:70}
.results.on{display:block}
.results .r{padding:9px 11px;border-radius:8px;cursor:pointer}
.results .r:hover{background:var(--gold-soft)}
.results .r small{display:block;color:var(--muted);font-size:11.5px}
.voicesel{max-width:150px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px}
@media(max-width:860px){.voicesel{max-width:96px;font-size:11px}}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--gold-soft)}
.menubtn{display:none}
.content{padding:26px;max-width:1120px;width:100%;flex:1}
.page-head{margin-bottom:20px}
.page-head .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.page-head p.sub{color:var(--muted);margin:8px 0 0;max-width:70ch}

/* ---------- CARDS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.tight{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile .n{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.1em}
.tile h4{margin:5px 0 4px;font-size:15.5px}
.tile p{margin:0;font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.p-gold{background:var(--gold-soft);color:var(--gold)}
.p-olive{background:var(--olive-soft);color:var(--olive)}
.p-red{background:var(--red-soft);color:var(--red)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--gold));border-radius:999px;transition:width .5s ease}
.stat .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.stat .lab b{color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- CONTENT BLOCKS ---------- */
.it{font-weight:600}
.en{color:var(--muted);font-style:italic}
.box{border-radius:12px;padding:14px 16px;margin:12px 0;border:1px solid var(--line);background:var(--panel)}
.box.say{border-left:3px solid var(--olive);background:var(--olive-soft)}
.box.mem{border-left:3px solid var(--gold);background:var(--gold-soft)}
.box.imp{border-left:3px solid var(--red);background:var(--red-soft)}
.box.voc{border-left:3px solid var(--blue);background:var(--blue-soft)}
.box h4{font-size:11px;letter-spacing:.11em;text-transform:uppercase;margin-bottom:7px;font-family:var(--sans)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.dlg{display:flex;gap:10px;margin:9px 0;align-items:flex-start}
.dlg .who{flex:0 0 78px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:3px;font-weight:700}
.dlg .txt{flex:1}
.speak{background:none;border:0;cursor:pointer;opacity:.5;font-size:14px;padding:0 4px}
.speak:hover{opacity:1}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}

/* ---------- EXERCISES ---------- */
.ex{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0;background:var(--panel)}
.ex .q{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);cursor:pointer;margin-bottom:7px;transition:.13s}
.opt:hover{border-color:var(--gold)}
.opt.correct{border-color:var(--olive);background:var(--olive-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.inp{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);min-width:180px}
.inp:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
.inp.ok{border-color:var(--olive);background:var(--olive-soft)}
.inp.no{border-color:var(--red);background:var(--red-soft)}
.fb{margin-top:9px;font-size:13.5px;padding:9px 12px;border-radius:9px;display:none}
.fb.on{display:block}
.fb.ok{background:var(--olive-soft);color:var(--olive)}
.fb.no{background:var(--red-soft);color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--gold)}
.chip.used{opacity:.32;pointer-events:none}
.slot{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:7px}

/* ---------- RIGHT PANEL ---------- */
.withpanel{display:grid;grid-template-columns:1fr 268px;gap:20px;align-items:start}
.side .card{padding:16px}
.side h4{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);margin-bottom:10px}
.goal{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;cursor:pointer}
.goal .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:0 0 16px;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.goal.on .bx{background:var(--olive);border-color:var(--olive)}
.goal.on span{text-decoration:line-through;color:var(--muted)}

/* ---------- SOS ---------- */
.sos{position:fixed;right:22px;bottom:22px;z-index:80;background:var(--red);color:#fff;border:0;border-radius:999px;
  padding:13px 20px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 22px rgba(176,70,58,.32)}
.modal{position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:90;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .sheet{background:var(--panel);border-radius:18px;padding:24px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}

/* ---------- MOBILE ---------- */
.mobnav{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:55}
.scrim.on{display:block}
@media(max-width:1080px){ .withpanel{grid-template-columns:1fr} .side{order:-1} .g4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.on{transform:none}
  .main{margin-left:0}
  .menubtn{display:grid}
  .content{padding:18px 15px 96px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .search{width:150px}
  .results{width:min(88vw,340px)}
  .sos{bottom:80px;right:14px;padding:11px 16px}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--panel);
    border-top:1px solid var(--line);padding:7px 4px 9px}
  .mobnav button{flex:1;background:none;border:0;display:grid;gap:3px;justify-items:center;cursor:pointer;
    font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .mobnav button .mi{font-size:17px;line-height:1}
  .mobnav button.on{color:var(--ink)}
}
@media print{.sidebar,.topbar,.mobnav,.sos{display:none}.main{margin:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="flag">CS</div>
      <div><b>Ciao Senda</b><span>Italiano A1 → A2</span></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn menubtn" id="menubtn">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="searchwrap">
        <span class="ico">⌕</span>
        <input class="search" id="search" placeholder="Search lessons, words, verbs…" autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <select id="voicesel" class="voicesel" title="Italian voice"></select>
      <button class="iconbtn" id="voicetest" title="Test the Italian voice">🔊</button>
      <button class="iconbtn" id="themebtn" title="Dark mode">◐</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<button class="sos" id="sosbtn">🆘 Non ho capito</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<nav class="mobnav">
  <button data-go="dashboard"><span class="mi">⌂</span>Home</button>
  <button data-go="a1"><span class="mi">✎</span>Learn</button>
  <button data-go="practice"><span class="mi">◎</span>Practice</button>
  <button data-go="rest-service"><span class="mi">✦</span>Restaurant</button>
  <button data-go="interview-sim"><span class="mi">✓</span>Interview</button>
</nav>
<script>
/* ============ CORE DATA: LESSONS ============ */
const A1 = [
{id:"a1-01",t:"Greetings",it:"Saluti",
 exp:"Italian has a polite form (Lei) and an informal form (tu). With customers and the chef in an interview, always use <b>Lei</b>. With colleagues you can use <b>tu</b>.",
 voc:[["Buongiorno","Good morning / good day"],["Buonasera","Good evening"],["Buonanotte","Good night"],["Ciao","Hi / bye (informal)"],["Arrivederci","Goodbye (polite)"],["Piacere","Nice to meet you"],["Come sta?","How are you? (polite)"],["Come stai?","How are you? (informal)"],["Bene, grazie","Well, thank you"],["A domani","See you tomorrow"]],
 dlg:[["Cliente","Buonasera."],["Senda","Buonasera, benvenuti! Avete una prenotazione?"],["Cliente","Sì, a nome Rossi."],["Senda","Perfetto. Prego, seguitemi."]],
 ex:[{k:"mc",q:"A guest arrives at 8 p.m. What do you say?",o:["Buongiorno","Buonasera","Buonanotte"],a:1,w:"After about 5 p.m. Italians say <b>buonasera</b>. <i>Buonanotte</i> is only used when leaving to sleep."},
     {k:"fb",q:"Polite goodbye to a guest: ______.",a:["arrivederci"],w:"<b>Arrivederci</b> is the polite goodbye. <i>Ciao</i> is only for friends and colleagues."},
     {k:"mc",q:"Which one do you NOT say to a customer?",o:["Arrivederci","Ciao","Buongiorno"],a:1,w:"<b>Ciao</b> is informal — never with guests."},
     {k:"tr",q:"Nice to meet you.",a:["piacere","piacere di conoscerla"],w:"<b>Piacere</b> — or the fuller <b>Piacere di conoscerla</b> in an interview."}],
 speak:["Greet a guest arriving at 20:00.","Introduce yourself to the chef in one sentence."]},

{id:"a1-02",t:"Introductions",it:"Presentarsi",
 exp:"Four sentences are enough to introduce yourself: name, age, origin, work or study.",
 voc:[["Mi chiamo…","My name is…"],["Ho 21 anni","I am 21 years old"],["Vengo dalla Tunisia","I come from Tunisia"],["Abito a Imperia","I live in Imperia"],["Studio ingegneria","I study engineering"],["Parlo arabo, francese e inglese","I speak Arabic, French and English"],["Sto imparando l'italiano","I am learning Italian"],["Cerco lavoro","I am looking for work"]],
 dlg:[["Chef","Mi parli un po' di lei."],["Senda","Mi chiamo Senda, ho 21 anni e vengo dalla Tunisia."],["Senda","Abito a Imperia e studio all'università."],["Senda","Sto imparando l'italiano e cerco un lavoro part-time."]],
 ex:[{k:"fb",q:"Mi ______ Senda.",a:["chiamo"],w:"<b>Mi chiamo</b> = my name is (literally: I call myself)."},
     {k:"fb",q:"______ 21 anni.",a:["ho"],w:"Italian uses <b>avere</b> for age: <i>ho 21 anni</i>, not <i>sono 21</i>."},
     {k:"mc",q:"'I come from Tunisia' =",o:["Vado dalla Tunisia","Vengo dalla Tunisia","Sono di Tunisia"],a:1,w:"<b>Venire da</b> = to come from. <i>Vado</i> means I go."},
     {k:"tr",q:"I am learning Italian.",a:["sto imparando l'italiano","sto imparando italiano"],w:"<b>Stare + gerundio</b> = an action happening now."}],
 speak:["Introduce yourself in 30 seconds.","Say your name, age, country and studies without stopping."]},

{id:"a1-03",t:"Numbers",it:"I numeri",
 exp:"You need numbers every shift: table numbers, covers, prices and times.",
 voc:[["uno, due, tre","1, 2, 3"],["quattro, cinque, sei","4, 5, 6"],["sette, otto, nove, dieci","7, 8, 9, 10"],["undici… venti","11… 20"],["trenta, quaranta, cinquanta","30, 40, 50"],["cento","100"],["il tavolo cinque","table five"],["due persone","two people"],["quattro coperti","four covers"],["quanto costa?","how much does it cost?"]],
 dlg:[["Chef","Quante persone al tavolo tre?"],["Senda","Quattro persone."],["Chef","E al tavolo cinque?"],["Senda","Due persone. Preparo subito."]],
 ex:[{k:"mc",q:"'Table seven' =",o:["il tavolo sei","il tavolo sette","il tavolo sedici"],a:1,w:"sette = 7, sei = 6, sedici = 16. Listen to the ending."},
     {k:"fb",q:"Cento = ______ (number)",a:["100"],w:"cento = 100."},
     {k:"tr",q:"How much does it cost?",a:["quanto costa","quanto costa?"],w:"<b>Quanto costa?</b> — one of the most useful questions."},
     {k:"mc",q:"The chef says 'tavolo quattordici'. Which table?",o:["4","14","40"],a:1,w:"quattordici = 14, quattro = 4, quaranta = 40. When unsure: «Mi scusi, quale tavolo?»"}],
 speak:["Count 1–20 out loud, twice.","Say five table numbers with the number of covers."]},

{id:"a1-04",t:"Days and time",it:"Giorni e orari",
 exp:"Shifts are given by day and hour. <b>Alle</b> + hour = at … o'clock.",
 voc:[["lunedì, martedì, mercoledì","Mon, Tue, Wed"],["giovedì, venerdì","Thu, Fri"],["sabato, domenica","Sat, Sun"],["oggi / domani / ieri","today / tomorrow / yesterday"],["la mattina / il pomeriggio / la sera","morning / afternoon / evening"],["alle sette","at seven"],["a che ora?","at what time?"],["il fine settimana","the weekend"],["il giorno libero","the day off"]],
 dlg:[["Chef","Quando può lavorare?"],["Senda","La sera e il fine settimana."],["Chef","Anche domenica a pranzo?"],["Senda","Sì, va bene."]],
 ex:[{k:"tr",q:"At what time?",a:["a che ora","a che ora?"],w:"<b>A che ora?</b> = at what time?"},
     {k:"fb",q:"Lavoro ______ sera. (in the evening)",a:["la"],w:"<b>la sera</b> = in the evening."},
     {k:"mc",q:"'Il fine settimana' means",o:["the end","the weekend","the week"],a:1,w:"fine settimana = weekend."},
     {k:"tr",q:"Tomorrow I work at seven.",a:["domani lavoro alle sette"],w:"Present tense + <i>domani</i> is enough for the future at A1."}],
 speak:["Say the seven days.","Say your availability for one week."]},

{id:"a1-05",t:"Family and people",it:"Famiglia e persone",
 exp:"Simple words for describing people — used in interviews and small talk.",
 voc:[["la madre / il padre","mother / father"],["il fratello / la sorella","brother / sister"],["il figlio / la figlia","son / daughter"],["l'amico / l'amica","friend"],["il collega / la collega","colleague"],["il capo","the boss"],["il cliente / la cliente","the customer"],["lo chef","the chef"],["il responsabile","the manager"],["la squadra","the team"]],
 dlg:[["Chef","Vive da sola a Imperia?"],["Senda","Sì, abito da sola. La mia famiglia è in Tunisia."],["Chef","Conosce qualcuno qui?"],["Senda","Sì, ho degli amici all'università."]],
 ex:[{k:"mc",q:"'Colleague' =",o:["il cliente","il collega","il capo"],a:1,w:"collega = colleague; cliente = customer."},
     {k:"fb",q:"Lavoro con la ______. (team)",a:["squadra"],w:"la squadra = the team."},
     {k:"tr",q:"The customer is waiting.",a:["il cliente aspetta"],w:"aspettare = to wait."},
     {k:"mc",q:"Who do you ask when there is a problem?",o:["il cliente","il responsabile","l'amico"],a:1,w:"«Chiedo al responsabile.»"}],
 speak:["Describe your family in four sentences."]},

{id:"a1-06",t:"Places",it:"I luoghi",
 exp:"Where things are. In a restaurant you need: sala, cucina, bagno, magazzino.",
 voc:[["la sala","the dining room"],["la cucina","the kitchen"],["il bagno","the toilet"],["il magazzino","the store room"],["la cantina","the wine cellar"],["il bar","the bar"],["l'ingresso","the entrance"],["dov'è…?","where is…?"],["qui / lì","here / there"],["a destra / a sinistra","right / left"]],
 dlg:[["Cliente","Scusi, dov'è il bagno?"],["Senda","È lì, a destra. Le faccio vedere."],["Cliente","Grazie mille."],["Senda","Prego."]],
 ex:[{k:"tr",q:"Where is the toilet?",a:["dov'è il bagno","dove è il bagno","dov'è il bagno?"],w:"<b>Dov'è…?</b> = where is…?"},
     {k:"mc",q:"'A sinistra' =",o:["on the right","on the left","straight on"],a:1,w:"sinistra = left, destra = right."},
     {k:"fb",q:"Vado in ______ a prendere i piatti. (kitchen)",a:["cucina"],w:"<b>in cucina</b> = to/in the kitchen."},
     {k:"mc",q:"The wine is kept in…",o:["la sala","la cantina","il bagno"],a:1,w:"la cantina = the cellar — also the name of the Equilibrio wine list."}],
 speak:["Tell a guest where the toilet is."]},

{id:"a1-07",t:"Food",it:"Il cibo",
 exp:"Basic food words. You do not need to cook — you need to recognise them on the menu and in allergy questions.",
 voc:[["il pesce","fish"],["la carne","meat"],["il pane","bread"],["il riso","rice"],["la pasta","pasta"],["la verdura","vegetables"],["la frutta","fruit"],["il formaggio","cheese"],["le uova","eggs"],["il sale / il pepe","salt / pepper"]],
 dlg:[["Cliente","C'è pesce in questo piatto?"],["Senda","Un momento, controllo subito con la cucina."],["Senda","Sì, c'è pesce. Le va bene?"],["Cliente","Sì, perfetto."]],
 ex:[{k:"mc",q:"'Le uova' =",o:["the eggs","the olives","the herbs"],a:1,w:"uovo (sing.) → uova (plural, irregular)."},
     {k:"tr",q:"Is there fish?",a:["c'è pesce","c'è pesce?","c'e pesce"],w:"<b>C'è…?</b> = is there…?"},
     {k:"fb",q:"Non c'è ______. (meat)",a:["carne","la carne"],w:"carne = meat."},
     {k:"mc",q:"A guest asks about an ingredient you don't know. You say:",o:["Penso di sì","Controllo subito con la cucina","Non lo so"],a:1,w:"Never guess about ingredients — always check."}],
 speak:["Answer: «C'è carne in questo piatto?» in two different ways."]},

{id:"a1-08",t:"Drinks",it:"Le bevande",
 exp:"Drinks are the first thing you sell every service. Learn these perfectly.",
 voc:[["l'acqua naturale","still water"],["l'acqua frizzante","sparkling water"],["il vino","wine"],["la birra","beer"],["il caffè","coffee"],["il tè","tea"],["il bicchiere","the glass"],["il calice","the wine glass"],["la bottiglia","the bottle"],["ancora un po'","a little more"]],
 dlg:[["Cliente","Possiamo avere dell'acqua?"],["Senda","Certo. Naturale o frizzante?"],["Cliente","Frizzante, grazie."],["Senda","Arrivo subito."]],
 ex:[{k:"mc",q:"A guest asks for water. Your first question:",o:["Grande o piccola?","Naturale o frizzante?","Con ghiaccio?"],a:1,w:"Always: still or sparkling."},
     {k:"tr",q:"Of course, right away.",a:["certo, subito","certo subito","va bene, subito"],w:"<b>Certo, subito</b> — two golden words."},
     {k:"fb",q:"Preferisce un ______ o una bottiglia? (glass of wine)",a:["calice"],w:"<b>calice</b> = wine glass; bicchiere = normal glass."},
     {k:"mc",q:"'Ancora un po' d'acqua?' means",o:["No more water?","A little more water?","Cold water?"],a:1,w:"ancora un po' = a little more."}],
 speak:["Take a drinks order for a table of four."]},

{id:"a1-09",t:"Restaurant basics",it:"Al ristorante",
 exp:"The ten sentences that carry a whole service.",
 voc:[["Benvenuti","Welcome"],["Avete una prenotazione?","Do you have a reservation?"],["Prego, seguitemi","Please follow me"],["Ecco il menu","Here is the menu"],["Siete pronti per ordinare?","Are you ready to order?"],["Buon appetito","Enjoy your meal"],["Va tutto bene?","Is everything all right?"],["Posso sparecchiare?","May I clear?"],["Ecco il conto","Here is the bill"],["Buona serata","Have a good evening"]],
 dlg:[["Senda","Buonasera, benvenuti! Avete una prenotazione?"],["Cliente","Sì, per due."],["Senda","Prego, seguitemi. Ecco il menu."],["Cliente","Grazie."]],
 ex:[{k:"tr",q:"Are you ready to order?",a:["siete pronti per ordinare","siete pronti per ordinare?"],w:"Plural <i>voi</i> form for a table."},
     {k:"mc",q:"You put the plates down. You say:",o:["Va tutto bene?","Buon appetito","Ecco il conto"],a:1,w:"Always <b>buon appetito</b> when serving."},
     {k:"fb",q:"Posso ______? (may I clear)",a:["sparecchiare"],w:"sparecchiare = to clear the table."},
     {k:"mc",q:"Correct order of a service:",o:["conto → menu → acqua","menu → acqua → ordine → conto","ordine → menu → conto"],a:1,w:"Menu and water first, order next, bill last."}],
 speak:["Say the ten service sentences in order, from memory."]},

{id:"a1-10",t:"Work",it:"Il lavoro",
 exp:"Talking about jobs — for the interview and for colleagues.",
 voc:[["il lavoro","the job / work"],["lavorare","to work"],["part-time","part-time"],["l'esperienza","experience"],["la caffetteria","the café"],["il cameriere / la cameriera","waiter / waitress"],["il runner","the runner"],["disponibile","available"],["imparare","to learn"],["il colloquio","the interview"]],
 dlg:[["Chef","Ha esperienza?"],["Senda","Sì, ho lavorato in una caffetteria."],["Chef","Cosa faceva?"],["Senda","Servivo i clienti e lavoravo alla cassa."]],
 ex:[{k:"tr",q:"I worked in a café.",a:["ho lavorato in una caffetteria"],w:"<b>Ho lavorato</b> = passato prossimo of lavorare."},
     {k:"fb",q:"Sono ______ la sera e il fine settimana. (available)",a:["disponibile"],w:"disponibile = available."},
     {k:"mc",q:"'Voglio imparare' =",o:["I want to work","I want to learn","I can learn"],a:1,w:"imparare = to learn — your most important verb in an interview."},
     {k:"tr",q:"I am looking for a part-time job.",a:["cerco un lavoro part-time","cerco lavoro part-time"],w:"cercare = to look for."}],
 speak:["Describe your café experience in four sentences."]},

{id:"a1-11",t:"Basic questions",it:"Fare domande",
 exp:"To ask a question in Italian you often keep the same word order and just raise your voice at the end. <i>Lavori qui?</i> = Do you work here?",
 voc:[["Chi?","Who?"],["Che cosa? / Cosa?","What?"],["Dove?","Where?"],["Quando?","When?"],["Perché?","Why?"],["Come?","How?"],["Quanto?","How much?"],["Quale?","Which?"],["A che ora?","At what time?"],["Quanti?","How many?"]],
 dlg:[["Senda","Scusi, dove devo mettere i bicchieri?"],["Collega","In cucina, a sinistra."],["Senda","E quando arriva il tavolo cinque?"],["Collega","Tra dieci minuti."]],
 ex:[{k:"mc",q:"____ vivi?",o:["Quando","Dove","Perché"],a:1,w:"<b>Dove</b> = where — used for places."},
     {k:"mc",q:"____ vuoi lavorare da noi?",o:["Perché","Quanto","Chi"],a:0,w:"<b>Perché</b> = why (and also 'because')."},
     {k:"fb",q:"______ persone? (how many)",a:["quante","quanti"],w:"<b>quante persone</b> (feminine plural), <b>quanti coperti</b> (masculine)."},
     {k:"tr",q:"At what time do I start?",a:["a che ora inizio","a che ora comincio"],w:"iniziare / cominciare = to start."}],
 speak:["Ask five questions using five different question words."]},

{id:"a1-12",t:"Basic answers",it:"Rispondere",
 exp:"Short answers are correct answers. You do not need full sentences to be polite.",
 voc:[["Sì, certo","Yes, of course"],["No, mi dispiace","No, I'm sorry"],["Va bene","All right"],["Subito","Right away"],["Non lo so","I don't know"],["Forse","Maybe"],["Un momento","One moment"],["Certamente","Certainly"],["Con piacere","With pleasure"],["Nessun problema","No problem"]],
 dlg:[["Chef","Puoi aiutare al tavolo tre?"],["Senda","Sì, certo. Vado subito."],["Chef","E dopo pulisci la sala."],["Senda","Va bene, nessun problema."]],
 ex:[{k:"mc",q:"The chef gives you a task. Best answer:",o:["Forse","Va bene, subito","Non lo so"],a:1,w:"<b>Va bene, subito</b> — accept and act."},
     {k:"tr",q:"One moment, I'll check.",a:["un momento, controllo","un momento controllo","un momento, controllo subito"],w:"Your safety sentence."},
     {k:"mc",q:"You don't know an ingredient. You say:",o:["Non lo so","Controllo subito con la cucina","Forse sì"],a:1,w:"'I don't know' alone is weak — 'I'll check' is professional."},
     {k:"fb",q:"Sì, ______. (of course)",a:["certo","certamente"],w:"Sì, certo."}],
 speak:["Answer five chef instructions with a short polite answer."]},

{id:"a1-13",t:"Daily routine",it:"La giornata",
 exp:"Describing your day uses the present tense — the tense you will use 90% of the time.",
 voc:[["mi sveglio","I wake up"],["faccio colazione","I have breakfast"],["vado all'università","I go to university"],["studio","I study"],["lavoro","I work"],["torno a casa","I go home"],["mangio","I eat"],["dormo","I sleep"],["di solito","usually"],["poi","then"]],
 dlg:[["Chef","Com'è la sua giornata?"],["Senda","La mattina vado all'università. Il pomeriggio studio."],["Chef","E la sera?"],["Senda","La sera sono libera. Posso lavorare."]],
 ex:[{k:"fb",q:"Di solito ______ all'università la mattina. (I go)",a:["vado"],w:"andare → io vado."},
     {k:"tr",q:"In the evening I am free.",a:["la sera sono libera","la sera sono libero"],w:"Senda: <i>libera</i> (feminine)."},
     {k:"mc",q:"'Poi' =",o:["before","then","never"],a:1,w:"poi = then — very useful for describing a sequence."},
     {k:"tr",q:"I work in the evening and I study in the morning.",a:["lavoro la sera e studio la mattina"],w:"Simple present, two clauses with <i>e</i>."}],
 speak:["Describe your day from morning to evening in six sentences."]},

{id:"a1-14",t:"Present tense",it:"Il presente",
 exp:"Three families of verbs: <b>-ARE</b> (lavorare), <b>-ERE</b> (prendere), <b>-IRE</b> (servire / capire). Remove the ending, add the new one.",
 voc:[["io -o","lavoro, prendo, servo"],["tu -i","lavori, prendi, servi"],["lui/lei -a / -e","lavora, prende, serve"],["noi -iamo","lavoriamo, prendiamo, serviamo"],["voi -ate/-ete/-ite","lavorate, prendete, servite"],["loro -ano/-ono","lavorano, prendono, servono"]],
 dlg:[["Chef","Cosa fa adesso?"],["Senda","Preparo il tavolo e porto l'acqua."],["Chef","E il suo collega?"],["Senda","Lui serve il tavolo tre."]],
 ex:[{k:"fb",q:"Io ______ in sala. (lavorare)",a:["lavoro"],w:"-are → io -o."},
     {k:"fb",q:"Noi ______ i clienti. (servire)",a:["serviamo"],w:"noi → -iamo, for all three families."},
     {k:"fb",q:"Lui ______ l'ordine. (prendere)",a:["prende"],w:"-ere → lui -e."},
     {k:"mc",q:"'Loro lavorano' =",o:["they work","we work","you work"],a:0,w:"loro → -ano (for -are verbs)."}],
 speak:["Conjugate lavorare, servire and prendere out loud."]},

{id:"a1-15",t:"Essential verbs",it:"I verbi essenziali",
 exp:"Four verbs unlock most sentences: <b>essere</b> (to be), <b>avere</b> (to have), <b>potere</b> (can) and <b>volere</b> (to want).",
 voc:[["sono / sei / è","I am / you are / he-she is"],["ho / hai / ha","I have / you have / he-she has"],["posso / puoi / può","I can / you can / he-she can"],["voglio / vuoi / vuole","I want / you want / he-she wants"],["Posso aiutarla?","Can I help you?"],["Voglio imparare","I want to learn"],["Ho 21 anni","I am 21"],["Sono disponibile","I am available"]],
 dlg:[["Cliente","Scusi!"],["Senda","Sì, posso aiutarla?"],["Cliente","Vorrei il conto."],["Senda","Certo, arrivo subito."]],
 ex:[{k:"fb",q:"______ disponibile la sera. (I am)",a:["sono"],w:"essere → io sono."},
     {k:"fb",q:"______ aiutarla? (can I)",a:["posso"],w:"potere → io posso + infinitive."},
     {k:"mc",q:"'Vorrei' is",o:["I want (strong)","I would like (polite)","I wanted"],a:1,w:"<b>Vorrei</b> is the polite form of <i>voglio</i> — guests use it constantly."},
     {k:"tr",q:"I want to learn.",a:["voglio imparare"],w:"volere + infinitive."}],
 speak:["Use posso, voglio, sono and ho in four restaurant sentences."]}
];

const A2 = [
{id:"a2-01",t:"The past",it:"Il passato",
 exp:"<b>Passato prossimo</b> = avere/essere + participle. Most verbs use <b>avere</b>: <i>ho lavorato, ho servito, ho preso</i>. Movement verbs use <b>essere</b>: <i>sono andata, sono arrivata</i> (with -a for Senda).",
 voc:[["ho lavorato","I worked"],["ho servito","I served"],["ho imparato","I learned"],["ho preso","I took"],["sono andata","I went"],["sono arrivata","I arrived"],["ho fatto","I did/made"],["ho chiesto","I asked"]],
 dlg:[["Chef","Che esperienza ha?"],["Senda","Ho lavorato in una caffetteria per un anno."],["Chef","Cosa ha imparato?"],["Senda","Ho imparato a servire e a parlare con i clienti."]],
 ex:[{k:"fb",q:"Ieri ______ lavorato in sala.",a:["ho"],w:"lavorare takes <b>avere</b>."},
     {k:"fb",q:"Sono ______ in cucina. (andare, Senda speaking)",a:["andata"],w:"With <i>essere</i> the participle agrees: <b>andata</b> for a woman."},
     {k:"tr",q:"I learned a lot.",a:["ho imparato molto","ho imparato tanto"],w:"imparare → ho imparato."},
     {k:"mc",q:"'Ho chiesto al responsabile' =",o:["I ask the manager","I asked the manager","I will ask the manager"],a:1,w:"chiedere → chiesto (irregular participle)."}],
 speak:["Say three things you did yesterday."]},

{id:"a2-02",t:"The future",it:"Il futuro",
 exp:"You can use the <b>present + a time word</b> for the future: <i>domani lavoro</i>. The real future adds -ò, -ai, -à: <i>lavorerò</i>. Both are correct — the first is easier.",
 voc:[["domani lavoro","tomorrow I work"],["lavorerò","I will work"],["arriverò alle sette","I will arrive at seven"],["sarò disponibile","I will be available"],["imparerò","I will learn"],["tra dieci minuti","in ten minutes"],["la prossima settimana","next week"],["più tardi","later"]],
 dlg:[["Chef","Quando può iniziare?"],["Senda","Posso iniziare la prossima settimana."],["Chef","Sarà disponibile anche il sabato?"],["Senda","Sì, sarò disponibile il sabato."]],
 ex:[{k:"fb",q:"Domani ______ alle sette. (arrivare, present for future)",a:["arrivo"],w:"Present + <i>domani</i> is perfectly natural Italian."},
     {k:"tr",q:"I will learn quickly.",a:["imparerò in fretta","imparerò velocemente","imparo in fretta"],w:"imparare → imparerò."},
     {k:"mc",q:"'Tra dieci minuti' =",o:["ten minutes ago","in ten minutes","every ten minutes"],a:1,w:"tra + time = in … from now."},
     {k:"fb",q:"______ disponibile la sera. (essere, future)",a:["sarò"],w:"essere → sarò (irregular)."}],
 speak:["Say what you will do tomorrow, three sentences."]},

{id:"a2-03",t:"Describing experience",it:"Raccontare l'esperienza",
 exp:"Interview answers follow a shape: <i>where → what I did → what I learned</i>.",
 voc:[["Ho lavorato in…","I worked in…"],["per un anno","for a year"],["servivo i clienti","I used to serve customers"],["ero alla cassa","I was at the till"],["ho imparato a…","I learned to…"],["mi è piaciuto","I liked it"],["è stata una buona esperienza","it was a good experience"]],
 dlg:[["Chef","Mi parli del suo lavoro precedente."],["Senda","Ho lavorato in una caffetteria per un anno."],["Senda","Servivo i clienti, preparavo il caffè e lavoravo alla cassa."],["Senda","Ho imparato a lavorare in fretta e con il sorriso."]],
 ex:[{k:"tr",q:"I worked there for one year.",a:["ho lavorato lì per un anno","ho lavorato per un anno"],w:"per + duration."},
     {k:"fb",q:"Ho imparato ______ servire i clienti.",a:["a"],w:"imparare <b>a</b> + infinitive."},
     {k:"mc",q:"'Servivo i clienti' is",o:["future","a repeated past action","a wish"],a:1,w:"Imperfetto = something you used to do regularly."},
     {k:"tr",q:"It was a good experience.",a:["è stata una buona esperienza"],w:"Learn it as one block."}],
 speak:["Answer: «Mi parli della sua esperienza» in 30 seconds."]},

{id:"a2-04",t:"Giving opinions",it:"Dare un'opinione",
 exp:"Simple opinion openers keep you safe and sound fluent.",
 voc:[["Penso che…","I think that…"],["Secondo me","In my opinion"],["Mi piace","I like"],["Non mi piace","I don't like"],["Preferisco","I prefer"],["È interessante","It's interesting"],["È bello","It's beautiful/nice"],["Sono d'accordo","I agree"]],
 dlg:[["Chef","Ha visto il nostro menu? Cosa ne pensa?"],["Senda","Sì, l'ho visto. Penso che sia molto creativo."],["Senda","Mi piacciono i piatti di pesce."],["Chef","Bene."]],
 ex:[{k:"tr",q:"In my opinion it is very creative.",a:["secondo me è molto creativo"],w:"Secondo me + normal sentence — no subjunctive needed."},
     {k:"mc",q:"Safest opinion opener at A2:",o:["Penso che sia…","Secondo me…","Riterrei che…"],a:1,w:"<b>Secondo me</b> avoids the subjunctive completely."},
     {k:"fb",q:"Mi ______ i piatti di pesce. (plural: I like)",a:["piacciono"],w:"Plural things → <b>piacciono</b>."},
     {k:"tr",q:"I prefer to work in the evening.",a:["preferisco lavorare la sera"],w:"preferire → preferisco (-isc verb)."}],
 speak:["Give your opinion about the Equilibrio menu in three sentences."]},

{id:"a2-05",t:"Making requests",it:"Chiedere qualcosa",
 exp:"Polite requests use <b>potrei / posso / vorrei</b>. With guests, always the polite Lei form.",
 voc:[["Posso…?","Can I…?"],["Potrei…?","Could I…?"],["Vorrei…","I would like…"],["Mi può aiutare?","Can you help me?"],["Mi scusi","Excuse me"],["Per favore","Please"],["Le dispiace se…?","Do you mind if…?"],["Grazie mille","Thank you very much"]],
 dlg:[["Senda","Mi scusi, mi può aiutare con il tavolo otto?"],["Collega","Certo, arrivo."],["Senda","Grazie mille."],["Collega","Di niente."]],
 ex:[{k:"tr",q:"Can you help me, please?",a:["mi può aiutare, per favore","mi puo aiutare per favore","mi può aiutare per favore"],w:"Polite Lei form of potere."},
     {k:"mc",q:"A guest says «Vorrei il conto». They want:",o:["the menu","the bill","more water"],a:1,w:"il conto = the bill."},
     {k:"fb",q:"______ sparecchiare? (may I)",a:["posso"],w:"Posso + infinitive."},
     {k:"tr",q:"Excuse me, one moment please.",a:["mi scusi, un momento per favore","mi scusi un momento per favore"],w:"Two safety phrases combined."}],
 speak:["Ask a colleague for help in three different ways."]},

{id:"a2-06",t:"Explaining problems",it:"Spiegare un problema",
 exp:"When something goes wrong: apologise, say what you will do, then do it. Never explain who made the mistake.",
 voc:[["C'è un problema","There is a problem"],["Mi dispiace","I'm sorry"],["Mi scusi","I apologise"],["Controllo subito","I'll check right away"],["Chiamo il responsabile","I'll call the manager"],["Risolviamo subito","We'll fix it right away"],["Ci sarà un piccolo ritardo","There will be a small delay"],["Grazie per la pazienza","Thank you for your patience"]],
 dlg:[["Cliente","Aspettiamo da quaranta minuti."],["Senda","Mi dispiace davvero per l'attesa."],["Senda","Controllo subito con la cucina e torno da voi."],["Cliente","Grazie."]],
 ex:[{k:"tr",q:"I'm sorry for the wait.",a:["mi dispiace per l'attesa","mi dispiace per l attesa"],w:"l'attesa = the wait."},
     {k:"mc",q:"A guest complains. First thing you say:",o:["Non è colpa mia","Mi dispiace","È la cucina"],a:1,w:"Never blame anyone. Apologise for the team."},
     {k:"fb",q:"______ subito il responsabile. (I call)",a:["chiamo"],w:"chiamare → io chiamo."},
     {k:"tr",q:"We will fix it right away.",a:["risolviamo subito"],w:"Say <i>we</i>, not <i>I</i> — it sounds like a team."}],
 speak:["Handle a 40-minute wait complaint in four sentences."]},

{id:"a2-07",t:"Customer service",it:"Il servizio clienti",
 exp:"Service Italian is short, warm and repetitive. The same twenty sentences all night.",
 voc:[["Come posso aiutarla?","How can I help you?"],["Desidera altro?","Would you like anything else?"],["Certo, volentieri","Of course, gladly"],["Le va bene?","Is that all right for you?"],["Torno subito","I'll be right back"],["È tutto a posto?","Is everything fine?"],["Prego","Please / you're welcome"],["Buon appetito","Enjoy your meal"]],
 dlg:[["Senda","È tutto a posto?"],["Cliente","Sì, buonissimo. Possiamo avere ancora un po' di pane?"],["Senda","Certo, volentieri. Torno subito."],["Cliente","Grazie."]],
 ex:[{k:"tr",q:"Would you like anything else?",a:["desidera altro","desidera altro?"],w:"Polite Lei form."},
     {k:"mc",q:"'Prego' can mean",o:["only 'please'","'you're welcome' and 'go ahead'","'sorry'"],a:1,w:"Prego is the answer to grazie, and also 'after you'."},
     {k:"fb",q:"______ subito. (I'll be right back)",a:["torno"],w:"tornare → io torno."},
     {k:"tr",q:"How can I help you?",a:["come posso aiutarla","come posso aiutarla?"],w:"aiutar<b>la</b> = help you (polite feminine object)."}],
 speak:["Do a full drink service: greet, offer, confirm, return."]},

{id:"a2-08",t:"Work situations",it:"Situazioni di lavoro",
 exp:"With colleagues use <b>tu</b>; with the chef in an interview use <b>Lei</b>. Keep it short during service.",
 voc:[["Ho finito","I've finished"],["Cosa devo fare?","What should I do?"],["Ho bisogno di aiuto","I need help"],["Posso portarlo?","Can I take it?"],["Per quale tavolo?","For which table?"],["Arrivo!","Coming!"],["Attenzione, scotta!","Careful, it's hot!"],["Dietro!","Behind you!"]],
 dlg:[["Chef","Senda, il tavolo cinque!"],["Senda","Arrivo! Per quale tavolo sono questi piatti?"],["Chef","Tavolo tre."],["Senda","Va bene, li porto subito."]],
 ex:[{k:"tr",q:"I need help.",a:["ho bisogno di aiuto"],w:"avere bisogno di = to need."},
     {k:"mc",q:"You don't know which table a plate is for:",o:["Guess","Per quale tavolo?","Take it anyway"],a:1,w:"Asking takes two seconds. A wrong table costs ten minutes."},
     {k:"fb",q:"Ho ______. Cosa devo fare? (finished)",a:["finito"],w:"finire → ho finito."},
     {k:"tr",q:"Careful, it's hot!",a:["attenzione, scotta","attenzione scotta"],w:"Safety word — learn it now."}],
 speak:["Report to the chef: finished, need help, which table."]},

{id:"a2-09",t:"Restaurant conversations",it:"Conversazioni al ristorante",
 exp:"Full exchanges — the guest speaks first, you answer in one or two short sentences.",
 voc:[["Avete un tavolo?","Do you have a table?"],["Siamo in quattro","There are four of us"],["Possiamo ordinare?","Can we order?"],["Cosa ci consiglia?","What do you recommend?"],["Il conto, per favore","The bill, please"],["Accettate la carta?","Do you take cards?"],["È stato ottimo","It was excellent"],["Complimenti allo chef","Compliments to the chef"]],
 dlg:[["Cliente","Cosa ci consiglia?"],["Senda","Le consiglio il menu degustazione."],["Cliente","Va bene, prendiamo quello."],["Senda","Ottima scelta. Grazie."]],
 ex:[{k:"tr",q:"Do you take cards?",a:["accettate la carta","accettate la carta?"],w:"Answer: «Sì, certo.»"},
     {k:"mc",q:"«Siamo in quattro» means",o:["We are at four o'clock","There are four of us","We want table four"],a:1,w:"essere in + number = to be a group of."},
     {k:"fb",q:"Le ______ il menu degustazione. (I recommend)",a:["consiglio"],w:"consigliare → io consiglio."},
     {k:"tr",q:"Excellent choice, thank you.",a:["ottima scelta, grazie","ottima scelta grazie"],w:"A warm, short reply."}],
 speak:["Run a full table conversation from arrival to bill."]},

{id:"a2-10",t:"Longer dialogues",it:"Dialoghi lunghi",
 exp:"When a conversation gets long, keep control with short confirmations: <i>certo, va bene, ho capito, subito</i>.",
 voc:[["Allora…","So…"],["Quindi","So / therefore"],["Ho capito","I understand"],["Un attimo","Just a second"],["Le confermo","I'll confirm to you"],["Riassumo","Let me summarise"],["Va bene così?","Is that all right?"],["Perfetto","Perfect"]],
 dlg:[["Cliente","Allora, vorremmo due menu, ma mia moglie non mangia pesce, e una bottiglia d'acqua."],["Senda","Un attimo, riassumo: due menu, uno senza pesce, e una bottiglia d'acqua. Va bene così?"],["Cliente","Sì, perfetto."],["Senda","Grazie, avviso subito la cucina."]],
 ex:[{k:"tr",q:"Let me summarise: two menus, one without fish.",a:["riassumo: due menu, uno senza pesce","riassumo due menu uno senza pesce"],w:"Summarising back prevents mistakes."},
     {k:"mc",q:"Best thing to do after a long order:",o:["Walk away fast","Repeat it back","Ask them to write it"],a:1,w:"Repeating back is the professional habit."},
     {k:"fb",q:"Ho ______. Avviso la cucina. (understood)",a:["capito"],w:"capire → ho capito."},
     {k:"tr",q:"Is that all right?",a:["va bene così","va bene così?","va bene cosi"],w:"Closes the order politely."}],
 speak:["Take a complicated order and repeat it back correctly."]},

{id:"a2-11",t:"Polite Italian",it:"L'italiano formale",
 exp:"The Lei form uses the third person: <i>Lei desidera</i>, not <i>tu desideri</i>. Learn the forms as fixed phrases and you will never get it wrong.",
 voc:[["Desidera?","What would you like?"],["Prego, si accomodi","Please, take a seat"],["Le porto…","I'll bring you…"],["Le consiglio…","I recommend to you…"],["Mi scusi","Excuse me (polite)"],["Come desidera","As you wish"],["La ringrazio","I thank you"],["Arrivederla","Goodbye (very polite)"]],
 dlg:[["Senda","Prego, si accomodi. Desidera un aperitivo?"],["Cliente","Sì, volentieri."],["Senda","Le porto la carta dei vini."],["Cliente","Grazie."]],
 ex:[{k:"mc",q:"To a customer you say:",o:["Cosa vuoi?","Desidera?","Che prendi?"],a:1,w:"<b>Desidera?</b> is the polite standard."},
     {k:"fb",q:"Prego, si ______. (take a seat)",a:["accomodi"],w:"accomodarsi → si accomodi."},
     {k:"tr",q:"I'll bring you the wine list.",a:["le porto la carta dei vini"],w:"<b>Le</b> = to you (polite)."},
     {k:"mc",q:"'La ringrazio' =",o:["I'm sorry","I thank you","I understand"],a:1,w:"More formal than grazie — good at the end of an interview."}],
 speak:["Greet and seat a guest using only polite forms."]},

{id:"a2-12",t:"Spontaneous speaking",it:"Parlare spontaneamente",
 exp:"You do not need more words — you need <b>starter phrases</b> that begin a sentence while your brain finds the rest.",
 voc:[["Allora…","So…"],["Beh…","Well…"],["Diciamo che…","Let's say that…"],["Per me…","For me…"],["Come dire…","How to say…"],["Un momento, penso","One moment, I'm thinking"],["Non so come si dice","I don't know how to say it"],["Come si dice… in italiano?","How do you say… in Italian?"]],
 dlg:[["Chef","Perché vuole lavorare qui?"],["Senda","Allora… voglio imparare in un posto serio."],["Senda","Diciamo che per me è la scuola migliore."],["Chef","Bene."]],
 ex:[{k:"tr",q:"How do you say 'tray' in Italian?",a:["come si dice tray in italiano","come si dice 'tray' in italiano"],w:"Answer: <b>il vassoio</b>."},
     {k:"mc",q:"You forget a word mid-sentence. Best move:",o:["Stop and stay silent","Say «come dire…» and continue","Switch to English immediately"],a:1,w:"Filler phrases keep the conversation alive."},
     {k:"fb",q:"______ un momento, penso.",a:["mi scusi","scusi"],w:"Buy time politely."},
     {k:"tr",q:"I don't know how to say it in Italian.",a:["non so come si dice in italiano"],w:"Honest and completely acceptable."}],
 speak:["Speak for 60 seconds about your day, using three filler phrases."]}
];

{n:19,g:"experience",c:"Sa apparecchiare un tavolo?",a:"Sì, un po'. Se serve, imparo il vostro metodo.",en:"Yes, a little. If needed, I'll learn your method.",kw:["apparecchiare","imparare"],s:"Un po', e imparo."},
{n:20,g:"experience",c:"Sa portare tre piatti insieme?",a:"Non ancora. Preferisco fare due viaggi e non rompere niente.",en:"Not yet. I prefer to make two trips and not break anything.",kw:["non ancora","due viaggi"],s:"Non ancora, ma imparo."},
{n:21,g:"experience",c:"Ha lavorato sotto pressione?",a:"Sì, la mattina la caffetteria era molto piena.",en:"Yes, in the morning the café was very busy.",kw:["la pressione","pieno"],s:"Sì, la caffetteria era piena."},
{n:22,g:"experience",c:"Ha esperienza con il vino?",a:"No, non ancora. Ma ho studiato la vostra carta dei vini.",en:"No, not yet. But I studied your wine list.",kw:["la carta dei vini"],s:"No, ma sto studiando."},
{n:23,g:"experience",c:"Sa usare la cassa?",a:"Sì, ho lavorato alla cassa in caffetteria.",en:"Yes, I worked at the till in the café.",kw:["la cassa"],s:"Sì."},
{n:24,g:"experience",c:"Perché vuole lavorare in un ristorante?",a:"Perché mi piace il contatto con le persone e voglio imparare un mestiere.",en:"Because I like contact with people and I want to learn a profession.",kw:["il mestiere","il contatto"],s:"Mi piacciono le persone."},
/* --- 25–34 WHY EQUILIBRIO --- */
{n:25,g:"why",c:"Perché vuole lavorare da noi?",a:"Ho guardato il vostro sito e il menu. Voglio imparare in un posto serio, migliorare il mio italiano e lavorare con la squadra.",en:"I looked at your website and the menu. I want to learn in a serious place, improve my Italian and work with the team.",kw:["il sito","imparare","la squadra"],s:"Voglio imparare in un posto serio."},
{n:26,g:"why",c:"Cosa sa del nostro ristorante?",a:"So che siete a Dolcedo, vicino a Imperia, e che lo chef è Jacopo Chieppa.",en:"I know you are in Dolcedo, near Imperia, and that the chef is Jacopo Chieppa.",kw:["Dolcedo","lo chef"],s:"Siete a Dolcedo, lo chef è Jacopo Chieppa."},
{n:27,g:"why",c:"Ha visto il nostro menu?",a:"Sì, l'ho visto. Avete due menu degustazione: Follia e Equilibrio.",en:"Yes, I saw it. You have two tasting menus: Follia and Equilibrio.",kw:["il menu degustazione"],s:"Sì, l'ho visto."},
{n:28,g:"why",c:"Cosa ne pensa?",a:"Penso che sia molto creativo. Mi piacciono i piatti di pesce.",en:"I think it's very creative. I like the fish dishes.",kw:["creativo","mi piacciono"],s:"È molto creativo."},
{n:29,g:"why",c:"Conosce il nostro concetto?",a:"Sì: «tra misura e vertigine». Precisione e creatività insieme.",en:"Yes: 'between measure and vertigo'. Precision and creativity together.",kw:["la misura","la creatività"],s:"Tra misura e vertigine."},
{n:30,g:"why",c:"Perché proprio Equilibrio e non un altro ristorante?",a:"Perché qui posso imparare molto. È un ristorante serio e la squadra è professionale.",en:"Because here I can learn a lot. It's a serious restaurant and the team is professional.",kw:["professionale"],s:"Perché qui imparo di più."},
{n:31,g:"why",c:"Cosa può portare al nostro team?",a:"Parlo quattro lingue, sono puntuale e imparo in fretta.",en:"I speak four languages, I'm punctual and I learn quickly.",kw:["puntuale","in fretta"],s:"Lingue, puntualità, voglia di imparare."},
{n:32,g:"why",c:"Ha guardato il nostro sito?",a:"Sì, ho guardato il sito e anche la carta dei vini.",en:"Yes, I looked at the website and also the wine list.",kw:["guardare","il sito"],s:"Sì, il sito e il menu."},
{n:33,g:"why",c:"Che cosa le piace di più del nostro menu?",a:"Mi piacciono i piatti di mare, per esempio il Cannolo di Mare.",en:"I like the seafood dishes, for example the Cannolo di Mare.",kw:["i piatti di mare"],s:"I piatti di mare."},
{n:34,g:"why",c:"Sa dove siamo?",a:"Sì, siete a Dolcedo, nell'entroterra di Imperia.",en:"Yes, you are in Dolcedo, in the hills behind Imperia.",kw:["l'entroterra"],s:"A Dolcedo."},
/* --- 35–45 CHEF & TEAMWORK --- */
{n:35,g:"team",c:"Le piace lavorare in squadra?",a:"Sì, molto. Preferisco lavorare con altre persone.",en:"Yes, a lot. I prefer working with other people.",kw:["la squadra","preferire"],s:"Sì, molto."},
{n:36,g:"team",c:"Cosa fa se non capisce un'istruzione?",a:"Chiedo di ripetere. Non dico mai «sì» se non ho capito.",en:"I ask them to repeat. I never say 'yes' if I didn't understand.",kw:["ripetere","capire"],s:"Chiedo di ripetere."},
{n:37,g:"team",c:"Cosa fa se lo chef parla troppo veloce?",a:"Dico: «Mi scusi, può parlare più lentamente, per favore?»",en:"I say: 'Sorry, can you speak more slowly, please?'",kw:["lentamente"],s:"Chiedo di parlare più lentamente."},
{n:38,g:"team",c:"Cosa fa se un collega la tratta male?",a:"Davanti ai clienti non discuto. Ne parlo dopo, con calma.",en:"In front of guests I don't argue. I talk about it afterwards, calmly.",kw:["discutere","con calma"],s:"Non discuto davanti ai clienti."},
{n:39,g:"team",c:"Cosa fa quando ha finito un compito?",a:"Chiedo: «Ho finito, cosa devo fare?»",en:"I ask: 'I've finished, what should I do?'",kw:["finire","il compito"],s:"Chiedo cosa devo fare."},
{n:40,g:"team",c:"Accetta le critiche?",a:"Sì. Se sbaglio, voglio saperlo per imparare.",en:"Yes. If I make a mistake, I want to know so I can learn.",kw:["sbagliare","la critica"],s:"Sì, voglio imparare."},
{n:41,g:"team",c:"Cosa fa se ha bisogno di aiuto?",a:"Lo dico subito: «Ho bisogno di aiuto.» Non aspetto troppo.",en:"I say it immediately: 'I need help.' I don't wait too long.",kw:["l'aiuto","subito"],s:"Chiedo aiuto subito."},
{n:42,g:"team",c:"Lo chef le dà tre cose da fare. Cosa risponde?",a:"«Sì, ho capito.» E ripeto le tre cose.",en:"'Yes, I understood.' And I repeat the three things.",kw:["ripetere","ho capito"],s:"Ripeto le tre cose."},
{n:43,g:"team",c:"È puntuale?",a:"Sì, arrivo sempre dieci minuti prima.",en:"Yes, I always arrive ten minutes early.",kw:["puntuale","prima"],s:"Sì, sempre."},
{n:44,g:"team",c:"Come reagisce quando c'è molta pressione?",a:"Resto calma e faccio una cosa alla volta.",en:"I stay calm and do one thing at a time.",kw:["calma","una cosa alla volta"],s:"Resto calma."},
{n:45,g:"team",c:"Cosa fa se fa un errore?",a:"Lo dico subito al responsabile e lo risolvo.",en:"I tell the manager immediately and fix it.",kw:["l'errore","risolvere"],s:"Lo dico subito."},
/* --- 46–53 DIFFICULT CUSTOMERS --- */
{n:46,g:"difficult",c:"Un cliente è arrabbiato. Cosa fa?",a:"Ascolto, mi scuso e chiamo il responsabile.",en:"I listen, apologise and call the manager.",kw:["ascoltare","scusarsi"],s:"Ascolto e chiamo il responsabile."},
{n:47,g:"difficult",c:"Un cliente aspetta da quaranta minuti.",a:"«Mi dispiace per l'attesa. Controllo subito con la cucina.»",en:"'I'm sorry for the wait. I'll check with the kitchen right away.'",kw:["l'attesa"],s:"Mi scuso e controllo."},
{n:48,g:"difficult",c:"Ha portato il piatto sbagliato.",a:"«Mi scusi, è un errore nostro. Lo porto via subito.»",en:"'I'm sorry, it's our mistake. I'll take it away right away.'",kw:["sbagliato","portare via"],s:"Mi scuso e lo cambio."},
{n:49,g:"difficult",c:"Un cliente dice che il vino sa di tappo.",a:"«Mi dispiace, chiamo subito il sommelier.»",en:"'I'm sorry, I'll call the sommelier right away.'",kw:["sa di tappo","il sommelier"],s:"Chiamo il sommelier."},
{n:50,g:"difficult",c:"Un cliente ha un'allergia. Cosa fa?",a:"«Grazie di avermelo detto. Controllo subito con la cucina.» Non indovino mai.",en:"'Thank you for telling me. I'll check with the kitchen right away.' I never guess.",kw:["l'allergia","controllare"],s:"Controllo con la cucina."},
{n:51,g:"difficult",c:"Un cliente non parla italiano.",a:"Parlo inglese o francese. Sono contenta di aiutare.",en:"I speak English or French. I'm happy to help.",kw:["inglese","francese"],s:"Parlo inglese o francese."},
{n:52,g:"difficult",c:"Un cliente le fa una domanda difficile.",a:"«Un momento, controllo e torno subito da lei.»",en:"'One moment, I'll check and come right back to you.'",kw:["controllare","tornare"],s:"Controllo e torno subito."},
{n:53,g:"difficult",c:"Un cliente è maleducato con lei.",a:"Resto gentile e professionale. Poi lo dico al responsabile.",en:"I stay kind and professional. Then I tell the manager.",kw:["gentile","professionale"],s:"Resto gentile e lo dico al responsabile."},
/* --- 54–67 MENU & SERVICE --- */
{n:54,g:"menu",c:"Come accoglie un cliente?",a:"«Buonasera, benvenuti. Avete una prenotazione?»",en:"'Good evening, welcome. Do you have a reservation?'",kw:["accogliere","la prenotazione"],s:"Buonasera, benvenuti."},
{n:55,g:"menu",c:"Cosa chiede per l'acqua?",a:"«Naturale o frizzante?»",en:"'Still or sparkling?'",kw:["naturale","frizzante"],s:"Naturale o frizzante?"},
{n:56,g:"menu",c:"Quando chiede delle allergie?",a:"Sempre prima di mandare l'ordine in cucina.",en:"Always before sending the order to the kitchen.",kw:["prima","l'ordine"],s:"Prima dell'ordine."},
{n:57,g:"menu",c:"Come prende un ordine?",a:"Scrivo tutto e poi ripeto l'ordine al cliente.",en:"I write everything down and then repeat the order back.",kw:["scrivere","ripetere"],s:"Scrivo e ripeto."},
{n:58,g:"menu",c:"Cosa dice quando serve un piatto?",a:"«Permesso… ecco a lei. Buon appetito.»",en:"'Excuse me… here you are. Enjoy your meal.'",kw:["permesso","buon appetito"],s:"Buon appetito."},
{n:59,g:"menu",c:"Quali menu degustazione abbiamo?",a:"Follia a centoquaranta euro e Equilibrio a cento euro. C'è anche Oltre, più venti euro.",en:"Follia at €140 and Equilibrio at €100. There is also Oltre, plus €20.",kw:["il menu degustazione"],s:"Follia e Equilibrio."},
{n:60,g:"menu",c:"Quanto è il coperto?",a:"Quattro euro a persona.",en:"Four euros per person.",kw:["il coperto"],s:"Quattro euro."},
{n:61,g:"menu",c:"Cos'è il Cannolo di Mare?",a:"È un piatto con gambero, seppie, ciliegie, avocado e mandorla.",en:"It's a dish with prawn, cuttlefish, cherries, avocado and almond.",kw:["il gambero","la mandorla"],s:"Gambero, seppie, ciliegie, avocado, mandorla."},
{n:62,g:"menu",c:"Il «Tiramisù di un Ligure» è un dolce?",a:"No, non è un dolce. È un piatto salato con baccalà, caffè, aglio di Vessalico, patate e cacao amaro.",en:"No, it's not a dessert. It's a savoury dish with cod, coffee, Vessalico garlic, potatoes and bitter cocoa.",kw:["salato","il baccalà"],s:"No, è salato."},
{n:63,g:"menu",c:"Cosa c'è nella Sardenaira?",a:"Spaghetto, pomodoro, capperi e colatura di alici.",en:"Spaghetti, tomato, capers and anchovy sauce.",kw:["i capperi","le alici"],s:"Spaghetto, pomodoro, capperi, alici."},
{n:64,g:"menu",c:"Cos'è «Storie di Mare»?",a:"È il pescato del giorno con ricci di mare, corno di bue e timo.",en:"It's the catch of the day with sea urchins, corno di bue pepper and thyme.",kw:["il pescato","i ricci"],s:"Il pescato del giorno."},
{n:65,g:"menu",c:"Cosa c'è nel piatto «Libano»?",a:"Costoletta di agnello, melanzane e citronette allo zaatar.",en:"Lamb chop, aubergines and a zaatar dressing.",kw:["l'agnello","le melanzane"],s:"Agnello, melanzane, zaatar."},
{n:66,g:"menu",c:"Un cliente chiede un ingrediente che lei non conosce.",a:"«Mi dispiace, controllo subito con la cucina.»",en:"'I'm sorry, I'll check with the kitchen right away.'",kw:["l'ingrediente"],s:"Controllo con la cucina."},
{n:67,g:"menu",c:"Cosa chiede prima di servire il vino?",a:"«Preferisce bianco o rosso? Un calice o una bottiglia?»",en:"'Do you prefer white or red? A glass or a bottle?'",kw:["il calice","la bottiglia"],s:"Bianco o rosso? Calice o bottiglia?"},
/* --- 68–75 AVAILABILITY --- */
{n:68,g:"avail",c:"Quando può iniziare?",a:"Posso iniziare da settembre.",en:"I can start from September.",kw:["iniziare","settembre"],s:"Da settembre."},
{n:69,g:"avail",c:"Quanti giorni può lavorare?",a:"Tre o quattro giorni alla settimana.",en:"Three or four days a week.",kw:["i giorni","la settimana"],s:"Tre o quattro giorni."},
{n:70,g:"avail",c:"Può lavorare la sera?",a:"Sì, la sera va benissimo.",en:"Yes, evenings are perfect.",kw:["la sera"],s:"Sì, la sera."},
{n:71,g:"avail",c:"E il fine settimana?",a:"Sì, sono disponibile anche il sabato e la domenica.",en:"Yes, I'm available on Saturday and Sunday too.",kw:["disponibile","il fine settimana"],s:"Sì, anche il weekend."},
{n:72,g:"avail",c:"E durante gli esami?",a:"Nelle settimane di esami ho bisogno di qualche giorno. La avviso due settimane prima.",en:"During exam weeks I need a few days. I'll tell you two weeks before.",kw:["gli esami","avvisare"],s:"Avviso due settimane prima."},
{n:73,g:"avail",c:"Come viene a Dolcedo?",a:"Con l'autobus. Sto controllando gli orari.",en:"By bus. I'm checking the timetables.",kw:["l'autobus","gli orari"],s:"Con l'autobus."},
{n:74,g:"avail",c:"Ha i documenti in regola?",a:"Sì, ho il permesso di soggiorno per studio.",en:"Yes, I have a student residence permit.",kw:["i documenti","il permesso"],s:"Sì, tutto in regola."},
{n:75,g:"avail",c:"Può fare un periodo di prova?",a:"Sì, volentieri. È un'ottima idea.",en:"Yes, gladly. It's a very good idea.",kw:["la prova","volentieri"],s:"Sì, volentieri."},
/* --- 76–85 STRENGTHS, WEAKNESSES, FUTURE --- */
{n:76,g:"strength",c:"Qual è il suo punto forte?",a:"Imparo in fretta e sono puntuale.",en:"I learn quickly and I'm punctual.",kw:["il punto forte","in fretta"],s:"Imparo in fretta."},
{n:77,g:"strength",c:"Qual è il suo punto debole?",a:"Il mio italiano non è ancora perfetto. Ma studio ogni giorno e miglioro.",en:"My Italian isn't perfect yet. But I study every day and I'm improving.",kw:["il punto debole","migliorare"],s:"Il mio italiano, ma miglioro."},
{n:78,g:"strength",c:"Perché dovrei prendere lei?",a:"Perché voglio davvero imparare questo lavoro, sono seria e parlo quattro lingue.",en:"Because I really want to learn this job, I'm serious and I speak four languages.",kw:["seria","le lingue"],s:"Voglio imparare e sono seria."},
{n:79,g:"strength",c:"Il suo italiano non basta per la mia sala.",a:"Capisco. Ma imparo in fretta e conosco già le frasi del servizio. Mi dia una prova.",en:"I understand. But I learn quickly and I already know the service phrases. Give me a trial.",kw:["la prova","il servizio"],s:"Mi dia una prova."},
{n:80,g:"strength",c:"È timida?",a:"Un po' all'inizio, ma con i clienti sono gentile e sorrido.",en:"A little at the beginning, but with customers I'm kind and I smile.",kw:["timida","sorridere"],s:"Un po', ma sorrido sempre."},
{n:81,g:"strength",c:"Cosa vuole imparare qui?",a:"Voglio imparare il servizio, il vino e l'italiano del ristorante.",en:"I want to learn service, wine and restaurant Italian.",kw:["il servizio","il vino"],s:"Il servizio e il vino."},
{n:82,g:"strength",c:"Dove si vede tra due anni?",a:"Voglio finire l'università e parlare italiano bene.",en:"I want to finish university and speak Italian well.",kw:["tra due anni","finire"],s:"All'università, con un buon italiano."},
{n:83,g:"strength",c:"Quanto vuole guadagnare?",a:"Mi fido della vostra proposta. Per me contano l'esperienza e la formazione.",en:"I trust your offer. Experience and training matter to me.",kw:["la proposta","la formazione"],s:"Mi fido della vostra proposta."},
{n:84,g:"strength",c:"Ha domande per me?",a:"Sì: qual è la cosa più importante che devo imparare nei primi giorni?",en:"Yes: what is the most important thing I must learn in the first days?",kw:["la domanda","i primi giorni"],s:"Cosa devo imparare per primo?"},
{n:85,g:"strength",c:"Vuole aggiungere qualcosa?",a:"La ringrazio per il tempo. Voglio davvero imparare e spero di avere l'occasione.",en:"Thank you for your time. I really want to learn and I hope to get the chance.",kw:["ringraziare","l'occasione"],s:"Grazie per il tempo."}
];

function done(id){ return !!S.done[id]; }

function countDone(prefix){ return Object.keys(S.done).filter(k=>S.done[k]&&k.indexOf(prefix)===0).length; }
function pct(prefix,total,base){
  const c=countDone(prefix);
  const p=Math.round(base+(100-base)*Math.min(1,c/Math.max(1,total)));
  return Math.min(100,p);
}

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=s=>String(s).toLowerCase().trim()
  .replace(/[’']/g,"'").replace(/\s+/g," ")
  .replace(/[.!?,;]+$/,"");
function eq(a,list){
  const n=norm(a);
  return list.some(x=>norm(x)===n || norm(x).replace(/[àèéìòù]/g,c=>({"à":"a","è":"e","é":"e","ì":"i","ò":"o","ù":"u"})[c])===n.replace(/[àèéìòù]/g,c=>({"à":"a","è":"e","é":"e","ì":"i","ò":"o","ù":"u"})[c]));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* --- text to speech --- */
let VOICE=null, VOICE_MANUAL=null, VOICES=[];
const IT_NAMES=/ital|alice|luca|federica|elsa|carla|paola|emma \(it|cosimo|itali/i;
function isItalian(v){
  if(!v) return false;
  const lang=(v.lang||"").toLowerCase().replace("_","-");
  return lang==="it" || lang.indexOf("it-")===0 || IT_NAMES.test(v.name||"");
}
function pickVoice(){
  VOICES=(("speechSynthesis" in window)?speechSynthesis.getVoices():[])||[];
  if(VOICE_MANUAL){ VOICE=VOICES.find(v=>v.name===VOICE_MANUAL)||null; if(VOICE) return; }
  const it=VOICES.filter(isItalian);
  // prefer a local/native Italian voice, then any Italian voice
  VOICE=it.find(v=>v.localService)||it[0]||null;
  fillVoicePicker();
}
function hasItalian(){ return VOICES.some(isItalian); }
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
  setTimeout(pickVoice,300); setTimeout(pickVoice,1200);
}
function say(txt,rate){
  if(!("speechSynthesis" in window)) return;
  if(!VOICE) pickVoice();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="it-IT"; u.rate=rate||0.85; u.pitch=1;
  if(VOICE) u.voice=VOICE;
  u.onerror=()=>{};
  speechSynthesis.speak(u);
}
function fillVoicePicker(){
  const sel=document.getElementById("voicesel");
  if(!sel) return;
  const it=VOICES.filter(isItalian), other=VOICES.filter(v=>!isItalian(v));
  sel.innerHTML =
    (it.length?`<optgroup label="Italiano">${it.map(v=>`<option value="${esc(v.name)}"${VOICE&&VOICE.name===v.name?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</optgroup>`:"")+
    `<optgroup label="${it.length?"Other voices (not Italian)":"No Italian voice found"}">${other.slice(0,25).map(v=>`<option value="${esc(v.name)}"${VOICE&&VOICE.name===v.name?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</optgroup>`;
  sel.onchange=()=>{ VOICE_MANUAL=sel.value; pickVoice(); say("Buonasera, benvenuti."); };
  const warn=document.getElementById("voicewarn");
  if(warn) warn.style.display=it.length?"none":"";
}

  return `<div class="box imp" id="voicewarn" style="display:none">

    return `<div class="ex" data-ex="mc" data-key="${key}" data-a="${it.a}" data-w="${esc(it.w||"")}">

    <div class="fb"></div></div>`;
}
function bindEx(root){
  $$(".ex[data-ex='mc']",root).forEach(ex=>{
    $$(".opt",ex).forEach(btn=>btn.onclick=()=>{
      if(ex.dataset.locked) return; ex.dataset.locked="1";
      const ok=+btn.dataset.i===+ex.dataset.a;
      btn.classList.add(ok?"correct":"wrong");
      if(!ok) $$(".opt",ex)[+ex.dataset.a].classList.add("correct");
      const fb=$(".fb",ex); fb.className="fb on "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Correct. ":"❌ Not quite. ")+(ex.dataset.w||"");
      if(!ok) addReview($(".q",ex).textContent,$$(".opt",ex)[+ex.dataset.a].textContent,ex.dataset.w,"exercise");
    });
  });
  $$(".ex[data-ex='txt']",root).forEach(ex=>{
    const inp=$(".inp",ex),fb=$(".fb",ex),list=(ex.dataset.a||"").split("|");
    const check=()=>{
      const ok=eq(inp.value,list);
      inp.className="inp "+(ok?"ok":"no");
      fb.className="fb on "+(ok?"ok":"no");
      fb.innerHTML=ok?("✅ Correct. "+(ex.dataset.w||"")):("❌ Try again. "+(ex.dataset.w||"")+" <br><b>Answer:</b> "+esc(list[0]));
      if(!ok) addReview($(".q",ex).textContent,list[0],ex.dataset.w,"exercise");
    };
    $(".check",ex).onclick=check;
    inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    $(".reveal",ex).onclick=()=>{ inp.value=list[0]; inp.className="inp ok"; fb.className="fb on ok"; fb.innerHTML="Answer: <b>"+esc(list[0])+"</b>. "+(ex.dataset.w||""); };
  });
}
function bind(){
  const v=$("#view");
  $$("[data-go]",v).forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$("[data-say]",v).forEach(b=>b.onclick=()=>say(b.dataset.say,+b.dataset.rate||0.85));

/* ---- VERB LAB ---- */
function conj(v){
  const stem=v.i.slice(0,-3), end=v.i.slice(-3);
  let pres=v.p;
  if(!pres){
    if(v.g==="isc") pres=[stem+"isco",stem+"isci",stem+"isce",stem+"iamo",stem+"ite",stem+"iscono"];
    else if(v.g==="iare") pres=[stem+"o",stem.slice(0,-1)+"i",stem+"a",stem.slice(0,-1)+"iamo",stem+"ate",stem+"ano"];
    else if(v.g==="gare") pres=[stem+"o",stem+"hi",stem+"a",stem+"hiamo",stem+"ate",stem+"ano"];
    else if(end==="are") pres=[stem+"o",stem+"i",stem+"a",stem+"iamo",stem+"ate",stem+"ano"];
    else if(end==="ere") pres=[stem+"o",stem+"i",stem+"e",stem+"iamo",stem+"ete",stem+"ono"];
    else pres=[stem+"o",stem+"i",stem+"e",stem+"iamo",stem+"ite",stem+"ono"];
  }
  const aux=v.aux==="essere"?["sono","sei","è","siamo","siete","sono"]:["ho","hai","ha","abbiamo","avete","hanno"];
  const sg=v.pp.replace(/o$/,"o/a"), pl=v.pp.replace(/o$/,"i/e");
  const pp=v.aux==="essere"?[sg,sg,sg,pl,pl,pl]:[v.pp,v.pp,v.pp,v.pp,v.pp,v.pp];
  const past=aux.map((a,i)=>a+" "+pp[i]);
  const fut=["ò","ai","à","emo","ete","anno"].map(e=>v.fs+e);
  return {pres:pres,past:past,fut:fut};
}
const PRON=["io","tu","lui/lei","noi","voi","loro"];

/* ---- INTERVIEW SIMULATOR ---- */
ROUTES["iv-sim"]=()=>{
  crumbs(["Interview","Simulator"]);
  AFTER=startSim;
  return head("Interview","Interview simulator","The chef asks. You type your answer in Italian. No answer is shown unless you ask for it.")+
  `<div class="card" id="simbox"></div>`;
};
let SIMSTATE=null;
function startSim(){
  SIMSTATE={i:0,answers:[],hints:0,shown:0,skipped:0};
  drawSim();
}
function drawSim(){
  const box=$("#simbox"); if(!box) return;
  const st=SIMSTATE;
  if(st.i>=SIM.length){ return simResult(); }
  const q=SIM[st.i];
  box.innerHTML=`
    <div class="spread"><span class="pill p-gold">Domanda ${st.i+1} / ${SIM.length}</span>
      <div class="bar" style="width:140px"><i style="width:${Math.round(st.i/SIM.length*100)}%"></i></div></div>
    <div class="dlg" style="margin-top:14px"><div class="who">Chef</div>
      <div class="txt it" style="font-size:17px">${esc(q.q)} ${sbtn(q.q,0.9)}</div></div>
    <textarea class="inp" id="simans" rows="3" style="width:100%;margin-top:12px" placeholder="Scrivi la tua risposta in italiano…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="simsubmit">Submit</button>
      <button class="btn" id="simhint">Hint</button>
      <button class="btn ghost" id="simshow">Show answer</button>
      <button class="btn ghost" id="simskip">I don't know</button>
    </div>
    <div class="fb" id="simfb"></div>`;
  $$("[data-say]",box).forEach(b=>b.onclick=()=>say(b.dataset.say,+b.dataset.rate||0.85));
  $("#simsubmit").onclick=()=>{
    const v=$("#simans").value.trim();
    if(!v){ return; }
    st.answers.push(v);
    const fb=$("#simfb"); fb.className="fb on ok";
    fb.innerHTML=`✅ Risposta registrata.<br><b>Model answer:</b> <span class="it">${esc(q.model)}</span>`;
    setTimeout(()=>{ st.i++; drawSim(); },1600);
  };
  $("#simhint").onclick=()=>{ st.hints++; const fb=$("#simfb"); fb.className="fb on"; fb.style.background="var(--gold-soft)";
    fb.innerHTML=`<b>Hint:</b> ${esc(q.hint)}`; };
  $("#simshow").onclick=()=>{ st.shown++; const fb=$("#simfb"); fb.className="fb on ok";
    fb.innerHTML=`<b>Model answer:</b> <span class="it">${esc(q.model)}</span>`; };
  $("#simskip").onclick=()=>{ st.skipped++; st.answers.push(""); st.i++; drawSim(); };
}
function simResult(){
  const st=SIMSTATE, n=SIM.length;
  const answered=st.answers.filter(a=>a.length>0).length;
  const words=st.answers.join(" ").split(/\s+/).filter(Boolean).length;
  const comm=Math.max(35,Math.round(answered/n*100)-st.shown*4);
  const voc=Math.max(30,Math.min(95,Math.round(words/n*14)));
  const gram=Math.max(35,Math.min(92,comm-6+ (words>60?6:0)));
  const know=Math.max(30,Math.min(95,comm-st.hints*3));
  const conf=Math.max(30,Math.min(95,comm-st.shown*6-st.skipped*8));
  mark("sim-done");
  $("#simbox").innerHTML=`
    <h3>Risultato</h3>
    <p style="color:var(--muted)">You answered ${answered} of ${n} questions, used ${st.hints} hints and revealed ${st.shown} answers.</p>
    ${statRow("Grammar",gram)}${statRow("Vocabulary",voc)}${statRow("Communication",comm)}${statRow("Restaurant knowledge",know)}${statRow("Confidence",conf)}
    <div class="box mem"><h4>What to do next</h4>
      ${st.shown>3?"You revealed several answers — learn those questions in the <b>By Topic</b> section first.<br>":""}
      ${st.skipped>2?"You skipped questions. Every skipped question is one the chef may ask.<br>":""}
      Practise the same questions out loud tomorrow, then run the simulator again without hints.</div>
    <div class="row"><button class="btn primary" onclick="startSim()">▶ Run again</button>
      <button class="btn" data-go="iv-groups">Study the answers</button></div>`;
  $$("[data-go]",$("#simbox")).forEach(b=>b.onclick=()=>go(b.dataset.go));
}

ROUTES["chef-sim"]=()=>{
  crumbs(["Interview","Chef Simulator"]);
  AFTER=startChef;

  `<div class="card" id="chefbox"></div>`;

let CHEFSTATE=null;
function startChef(){ CHEFSTATE={i:0,ok:0}; drawChef(); }
function drawChef(){
  const box=$("#chefbox"); if(!box) return;
  const st=CHEFSTATE;
  if(st.i>=CHEF_CMDS.length){
    const p=Math.round(st.ok/CHEF_CMDS.length*100);
    mark("chef-done");
    box.innerHTML=`<h3>Fine servizio</h3>${statRow("Understanding chef instructions",p)}
      <div class="box ${p>=70?"say":"imp"}">${p>=70?"Ottimo. You understood most instructions.":"Practise the Listening Lab → Chef instructions, then run this again."}</div>
      <button class="btn primary" onclick="startChef()">▶ Run again</button>`;
    return;
  }
  const c=CHEF_CMDS[st.i];
  const rate=0.85+st.i*0.045;
  box.innerHTML=`
    <div class="spread"><span class="pill p-red">Istruzione ${st.i+1} / ${CHEF_CMDS.length}</span>
      <span class="pill p-gold">speed ${Math.round(rate*100)}%</span></div>
    <div class="row" style="margin:14px 0"><button class="btn" id="chefplay">🔊 Play instruction</button>
      <button class="btn ghost" id="chefslow">🔊 Slower</button>
      <button class="btn ghost" id="chefshow">Show text</button></div>
    <div class="box voc" id="cheftext" style="display:none"><span class="it">${esc(c.c)}</span></div>
    <p class="q" style="font-weight:600;margin-top:12px">What must you do?</p>
    ${c.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}
    <div class="fb" id="cheffb"></div>`;
  const play=()=>say(c.c,rate);
  $("#chefplay").onclick=play; $("#chefslow").onclick=()=>say(c.c,0.7);
  $("#chefshow").onclick=()=>{ const t=$("#cheftext"); t.style.display=t.style.display==="none"?"":"none"; };
  play();
  $$(".opt",box).forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===c.a; if(ok) st.ok++;
    b.classList.add(ok?"correct":"wrong");
    const fb=$("#cheffb"); fb.className="fb on "+(ok?"ok":"no");
    fb.innerHTML=(ok?"✅ Giusto. ":"❌ No. ")+"<b>"+esc(c.c)+"</b> — "+esc(c.o[c.a]);
    if(!ok) addReview(c.c,c.o[c.a],"Chef instruction","chef");
    setTimeout(()=>{ st.i++; drawChef(); },1700);
  });
};

ROUTES["q-vocab"]=()=>{
  const pool=shuffle(VOCAB_POOL).slice(0,10);
  const items=pool.map(p=>{
    const wrong=shuffle(VOCAB_POOL.filter(x=>x[1]!==p[1])).slice(0,2).map(x=>x[1]);
    const opts=shuffle([p[1]].concat(wrong));
    return {k:"mc",q:`<span class="it">${esc(p[0])}</span> = ?`,o:opts,a:opts.indexOf(p[1]),w:`<b>${esc(p[0])}</b> = ${esc(p[1])}`};
  });

function bindBuild(){
  $$("[data-build]").forEach(box=>{
    const i=+box.dataset.build, target=SENT_BUILD[i].w.join(" ");
    const slot=$(".slot",box), fb=$(".fb",box);
    $$(".chip",box).forEach(c=>c.onclick=()=>{
      c.classList.add("used");
      const s=document.createElement("span"); s.className="chip"; s.textContent=c.dataset.w;
      s.onclick=()=>{ s.remove(); c.classList.remove("used"); };
      slot.appendChild(s);
    });
    $(".bcheck",box).onclick=()=>{
      const got=$$(".chip",slot).map(x=>x.textContent).join(" ");
      const ok=norm(got)===norm(target);
      fb.className="fb on "+(ok?"ok":"no");
      fb.innerHTML=ok?("✅ Perfetto. "+esc(target)):("❌ Not yet. <b>"+esc(target)+"</b>");
      if(ok) say(target);
      else addReview(SENT_BUILD[i].en,target,"Sentence order","builder");
    };
    $(".breset",box).onclick=()=>{ slot.innerHTML=""; $$(".chips .chip",box).forEach(c=>c.classList.remove("used")); fb.className="fb"; };
  });
}

const INDEX=[];
function buildIndex(){
  A1.forEach(l=>INDEX.push({t:l.t+" — "+l.it,s:"A1 lesson",go:"a1/"+l.id,k:(l.t+" "+l.it+" "+l.voc.map(v=>v.join(" ")).join(" ")).toLowerCase()}));
  A2.forEach(l=>INDEX.push({t:l.t+" — "+l.it,s:"A2 lesson",go:"a2/"+l.id,k:(l.t+" "+l.it+" "+l.voc.map(v=>v.join(" ")).join(" ")).toLowerCase()}));
  GRAMMAR.forEach(g=>INDEX.push({t:g.t,s:"Grammar "+g.lvl,go:"grammar/"+g.id,k:(g.t+" "+g.rule).toLowerCase()}));
  VERBS.forEach(v=>INDEX.push({t:v.i,s:"Verb — "+v.e,go:"verbs/"+v.i,k:(v.i+" "+v.e+" "+v.pp).toLowerCase()}));
  REST.forEach(r=>INDEX.push({t:r.t,s:"Restaurant — "+r.it,go:"rest/"+r.id,k:(r.t+" "+r.it+" "+r.voc.map(v=>v.join(" ")).join(" ")).toLowerCase()}));
  EQ.dishes.forEach((d,i)=>INDEX.push({t:d.n,s:"Equilibrio dish",go:"eq-dishes",k:(d.n+" "+d.ing.join(" ")).toLowerCase()}));
  IQ.forEach(q=>INDEX.push({t:"Q"+q.n+" · "+q.c,s:"Interview — "+q.a,go:"iv-g/"+q.g,k:(q.c+" "+q.a+" "+q.en).toLowerCase()}));
  QWORDS.forEach(q=>INDEX.push({t:q.w,s:"Question word — "+q.m,go:"qwords",k:(q.w+" "+q.m).toLowerCase()}));
  SPEAK_CARDS.forEach(c=>INDEX.push({t:c.t,s:"Speaking card",go:"sp-daily",k:c.t.toLowerCase()}));
}
function search(q){
  q=q.toLowerCase().trim();
  const box=$("#results");
  if(q.length<2){ box.classList.remove("on"); return; }
  const hits=INDEX.filter(x=>x.k.indexOf(q)>=0).slice(0,12);
  box.innerHTML=hits.length?hits.map(h=>`<div class="r" data-go="${h.go}">${esc(h.t)}<small>${esc(h.s)}</small></div>`).join("")
    :`<div class="r">No results for “${esc(q)}”</div>`;
  box.classList.add("on");
  $$(".r[data-go]",box).forEach(r=>r.onclick=()=>{ box.classList.remove("on"); $("#search").value=""; go(r.dataset.go); });
}

function runTimer(btn){
  let s=+btn.dataset.sec;
  const out=btn.parentElement.querySelector(".tval");
  btn.disabled=true;
  const tick=()=>{
    if(out) out.textContent=s+"s";
    if(s<=0){ btn.disabled=false; if(out) out.textContent="✓ Fatto"; return; }
    s--; setTimeout(tick,1000);
  };
  tick();
}
